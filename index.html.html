<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SPACE LAB — 우주 과학 놀이터</title>
<style>
:root{--bg:#04070f;--navy:#0a1430;--line:#1d3566;--teal:#41e0c9;--ink:#d6e8ff;--dim:#7d93bd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%}
#hub{position:fixed;inset:0;height:100dvh;overflow-y:auto;padding:5vh 16px 28px;display:flex;flex-direction:column;align-items:center}
h1{margin:0;font-size:clamp(34px,7vw,72px);letter-spacing:.14em;font-weight:900;text-align:center;background:linear-gradient(180deg,#fff,#7ff0de 55%,#2a86d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:6px 0 4vh;color:var(--teal);letter-spacing:.3em;font-size:clamp(13px,2vw,18px);text-align:center}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:min(1080px,100%)}
.card{position:relative;background:linear-gradient(180deg,rgba(16,34,76,.9),rgba(8,18,44,.92));border:1px solid var(--line);border-radius:12px;padding:22px 20px 20px;text-align:left;color:var(--ink);font-family:inherit;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:8px;min-height:290px}
.card:hover{border-color:var(--teal);box-shadow:0 0 26px rgba(65,224,201,.35);transform:translateY(-3px)}
.card .ic{font-size:46px;line-height:1}
.card h2{margin:4px 0 0;font-size:22px;letter-spacing:.04em}
.card .tag{font-size:12.5px;color:var(--teal);letter-spacing:.12em}
.card p{margin:0;font-size:14.5px;line-height:1.6;color:#b4c8ea;flex:1}
.card .go{align-self:flex-start;margin-top:6px;background:linear-gradient(180deg,#27d6bd,#13917f);color:#02201c;font-weight:800;padding:9px 18px;border-radius:6px;font-size:15px}
.card.soon .go{background:#1a2c58;color:#9db4dc}
.card .badge{position:absolute;top:14px;right:14px;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
.foot{margin-top:4vh;font-size:13px;color:var(--dim);text-align:center;line-height:1.7}
.credit{display:inline-block;margin-top:10px;padding:6px 16px;border:1px solid var(--line);border-radius:20px;color:#b4c8ea;font-size:13.5px;letter-spacing:.06em}
.foot kbd{background:#12254f;border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:#fff;font-family:inherit}
#fsTop{position:fixed;right:12px;top:12px;z-index:5;background:rgba(10,20,48,.85);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
#fsTop:hover{border-color:var(--teal)}
#stage{position:fixed;inset:0;height:100dvh;background:#000;display:none;z-index:10}
#stage.on{display:block}
#stage iframe{display:block;width:100%;height:100%;border:0;background:#050818}
#back{position:fixed;left:0;top:62%;z-index:12;display:none;background:rgba(6,14,34,.8);border:1px solid var(--line);border-left:0;color:var(--ink);padding:9px 12px 9px 8px;border-radius:0 8px 8px 0;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;opacity:.55;transition:.2s}
#back:hover,#back:focus{opacity:1;border-color:var(--teal)}
#back.on{display:block}
#ai{position:fixed;inset:0;display:none;place-items:center;background:rgba(2,6,16,.8);z-index:20;padding:14px}
#ai.on{display:grid}
#ai .box{background:rgba(6,14,34,.96);border:1px solid var(--line);border-radius:12px;padding:24px 26px;max-width:560px;width:100%;line-height:1.7;font-size:15px}
#ai h3{margin:0 0 8px;font-size:22px}
#ai code{background:#12254f;padding:1px 6px;border-radius:4px;color:#7ff0de}
#ai .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#ai button{background:linear-gradient(180deg,#27d6bd,#13917f);border:0;color:#02201c;font-weight:800;padding:10px 18px;border-radius:6px;font-size:15px;cursor:pointer;font-family:inherit}
#ai button.g{background:#1a2c58;color:#cfe0ff}
@media(max-width:820px){.cards{grid-template-columns:1fr}.card{min-height:0}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<button id="fsTop" title="전체 화면">⛶ 전체 화면 (F)</button>
<main id="hub">
  <h1>SPACE LAB</h1>
  <div class="sub">우주 과학 놀이터</div>
  <div class="cards">
    <button class="card" data-g="rocket"><div class="ic">🚀</div><h2>ROCKET LAB</h2><div class="tag">로켓 발사 시뮬레이터</div>
      <p>엔진과 연료탱크로 나만의 로켓을 설계하고, 지구 저궤도에 올려 위성을 배치하세요. 추력·중력·공기저항·궤도 속도를 몸으로 배워요.</p><span class="go">▶ 플레이</span></button>
    <button class="card" data-g="galaxy"><div class="ic">👾</div><h2>과학 갤럭시</h2><div class="tag">갤러그 스타일 과학 퀴즈 슈팅</div>
      <p>장애물을 피하며 랜덤 박스의 과학 퀴즈를 풀어 코인을 모으세요. 1~6학년 난이도, 코인으로 비행기 스킨을 사는 상점이 있어요.</p><span class="go">▶ 플레이</span></button>
    <button class="card" data-g="ai"><div class="ic">🤖</div><h2>사이언스 AI</h2><div class="tag">나만의 과학 도우미</div>
      <p>과학 질문에 답해 주는 AI 도우미예요. 과학사 논문 100편으로 퀴즈를 풀고, 궁금한 과학 용어를 물어보고, 논문을 검색해 볼 수 있어요.</p><span class="go">▶ 시작하기</span></button>
  </div>
  <div class="foot">게임 중 왼쪽의 <b>← 허브</b> 탭으로 돌아올 수 있어요 · 전체 화면 <kbd>F</kbd><br><span class="credit">제작 지원 : 큐비아 탐구학원</span></div>
</main>
<div id="stage"></div>
<button id="back">← 허브</button>

<script type="text/plain" id="src-rocket"><!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ROCKET LAB — 우주로 가는 도전</title>
<style>
:root{--bg:#04070f;--navy:#0a1430;--navy2:#101e44;--line:#1d3566;--teal:#41e0c9;--teal2:#1fa896;--ink:#d6e8ff;--dim:#7d93bd;--warn:#ffb454;--bad:#ff5470;--ok:#5dffa0;--blue:#6aa8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;height:100dvh}
canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.btn{background:linear-gradient(180deg,rgba(20,40,84,.9),rgba(10,22,52,.92));border:1px solid var(--line);border-radius:6px;padding:10px 16px;font-size:15px;font-weight:700;letter-spacing:.02em;transition:.15s;min-height:42px}
.btn:hover:not(:disabled){border-color:var(--teal);box-shadow:0 0 14px rgba(65,224,201,.35);color:#fff}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#27d6bd,#13917f);border-color:#6bf3dd;color:#02201c;text-shadow:none}
.btn.pri:hover:not(:disabled){color:#02201c;box-shadow:0 0 22px rgba(65,224,201,.7)}
.btn.danger{border-color:#7b2b3d}
.btn.on{border-color:var(--teal);color:var(--teal);box-shadow:inset 0 0 10px rgba(65,224,201,.25)}
.panel{background:rgba(6,14,34,.82);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.mono{font-family:"JetBrains Mono","Roboto Mono",Consolas,"D2Coding",monospace;font-variant-numeric:tabular-nums}

/* ---------- 시작 화면 ---------- */
#menu .box{position:absolute;left:0;right:0;bottom:0;padding:0 16px 5vh;display:flex;flex-direction:column;align-items:center;gap:14px}
#menu .title{position:absolute;top:6vh;left:0;right:0;text-align:center;padding:0 12px}
#menu h1{margin:0;font-size:clamp(34px,7vw,76px);letter-spacing:.14em;font-weight:900;background:linear-gradient(180deg,#fff,#7ff0de 55%,#2a86d6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(65,224,201,.35))}
#menu .sub{margin-top:6px;font-size:clamp(14px,2.2vw,22px);color:var(--teal);letter-spacing:.35em}
#menu .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#menu .btns .btn{min-width:150px;font-size:17px;padding:13px 22px}
#menu .rec{font-size:13px;color:var(--dim)}

/* ---------- 연구소 ---------- */
#lab{display:none}
#lab.on{display:flex;flex-direction:row;gap:12px;padding:12px}
#lab .col{display:flex;flex-direction:column;gap:10px;min-height:0}
#labL{width:min(430px,34vw);min-width:330px}
#labR{width:min(330px,28vw);min-width:270px}
#labM{flex:1;position:relative;min-width:0}
#labPreview{position:absolute;inset:34px 0 54px 0}
#labM .cap{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:13px;color:var(--teal);letter-spacing:.3em;pointer-events:none}
#labM .acts{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.scroll{overflow-y:auto;min-height:0;flex:1;padding:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.hd{font-size:13px;letter-spacing:.2em;color:var(--teal);margin:14px 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
.hd:first-child{margin-top:0}
.hd:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:rgba(14,28,64,.7);border:1px solid var(--line);border-radius:7px;padding:9px 8px;text-align:left;font-size:12.5px;line-height:1.45;transition:.15s;position:relative;min-height:44px}
.card b{display:block;font-size:14px;margin-bottom:2px}
.card small{display:block;color:var(--dim);font-size:11.5px}
.card:hover{border-color:#3b66b8}
.card.sel{border-color:var(--teal);background:rgba(25,70,86,.55);box-shadow:0 0 12px rgba(65,224,201,.3)}
.card .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%}
.toggle{display:flex;gap:8px}
.toggle .btn{flex:1;font-size:14px;padding:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(29,53,102,.6);font-size:14px;gap:8px}
.row span:first-child{color:var(--dim);font-size:13px}
.row b{font-weight:700}
.bar{height:7px;border-radius:4px;background:#0a1a3c;border:1px solid var(--line);overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--teal));width:0;transition:width .25s}
.note{font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:8px}
#verdict{margin-top:10px;padding:10px;border-radius:7px;border:1px solid var(--line);font-size:13.5px;line-height:1.5}
#labBack{position:absolute;left:0;top:0;z-index:3;padding:6px 12px;min-height:36px;font-size:13px}
.good{color:var(--ok)}.mid{color:var(--warn)}.bad{color:var(--bad)}

/* ---------- 비행 HUD ---------- */
#flight{pointer-events:none}
#flight .panel,#flight button,#flight input{pointer-events:auto}
#iL{position:absolute;left:10px;top:10px;width:232px;padding:10px 12px;font-size:13px}
#iL .grp{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.m{line-height:1.15}.m small{display:block;color:var(--dim);font-size:11px;letter-spacing:.06em;margin-bottom:1px}
.m b{font-size:18px;font-weight:700}.m b em{font-style:normal;font-size:11px;color:var(--dim);margin-left:2px}
.m.big{grid-column:1/-1}.m.big b{font-size:26px;color:#fff}
.gauge{margin-top:8px}
.gauge .gl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim)}
.gauge .gl b{color:var(--ink);font-weight:700}
#iR{position:absolute;right:10px;top:10px;width:226px;display:flex;flex-direction:column;gap:8px}
#mapBox{padding:6px}
#mapBox canvas{width:100%;display:block;border-radius:6px;background:rgba(2,6,16,.7)}
#mapBox .ml{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:4px 4px 0}
#missions{padding:8px 10px;font-size:13px}
#missions h3,#iL h3{margin:0 0 6px;font-size:12px;letter-spacing:.2em;color:var(--teal)}
.ms{display:flex;gap:8px;align-items:center;padding:3px 0;color:var(--dim)}
.ms i{width:16px;height:16px;border:1.5px solid var(--line);border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:11px;color:transparent}
.ms.cur{color:var(--ink)}.ms.cur i{border-color:var(--teal)}
.ms.done{color:var(--ok)}.ms.done i{background:var(--ok);border-color:var(--ok);color:#022}
#topC{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100vw - 500px)}
#status{padding:6px 18px;font-size:14px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
#tplus{font-size:22px;font-weight:700;color:#fff;text-shadow:0 0 10px #000}
#hint{font-size:13.5px;color:var(--ink);background:rgba(4,10,26,.75);border:1px solid var(--line);padding:6px 12px;border-radius:6px;text-align:center;line-height:1.4;max-width:560px}
#warn{position:absolute;left:50%;top:132px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.wn{padding:7px 16px;border-radius:6px;background:rgba(80,10,26,.88);border:1px solid var(--bad);color:#ffd5dc;font-weight:700;font-size:14px;animation:blink .7s infinite alternate}
.wn.y{background:rgba(70,48,6,.88);border-color:var(--warn);color:#ffe9c4}
@keyframes blink{from{opacity:1}to{opacity:.45}}
#toasts{position:absolute;left:50%;top:38%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:92vw}
.toast{background:rgba(6,18,40,.88);border:1px solid var(--teal);border-radius:8px;padding:9px 20px;font-size:17px;font-weight:700;color:#fff;box-shadow:0 0 20px rgba(65,224,201,.35);animation:tin .35s ease-out,tout .5s 3.2s forwards;text-align:center}
.toast.big{font-size:24px;padding:12px 28px;border-color:var(--ok);box-shadow:0 0 28px rgba(93,255,160,.5)}
.toast.bad{border-color:var(--bad);box-shadow:0 0 20px rgba(255,84,112,.4)}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#cd{position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none;display:none}
#cd b{font-size:clamp(90px,18vw,200px);font-weight:900;color:#fff;text-shadow:0 0 40px rgba(65,224,201,.8);line-height:1}
#cd small{display:block;font-size:18px;letter-spacing:.4em;color:var(--teal);margin-top:6px}
#bar{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;justify-content:center;flex-wrap:wrap;pointer-events:none}
#bar .grp{display:flex;gap:6px;align-items:stretch;pointer-events:auto;padding:6px;flex-wrap:wrap;justify-content:center}
#bar .btn{padding:8px 12px;font-size:14px;min-height:44px;min-width:46px}
#bar .btn small{display:block;font-size:10.5px;font-weight:400;color:var(--dim);margin-top:1px}
#thrBox{display:flex;align-items:center;gap:8px;padding:0 6px}
#thrBox .tv{width:56px;text-align:center;font-size:20px;font-weight:700;color:var(--teal)}
#thr{-webkit-appearance:none;appearance:none;width:170px;height:8px;border-radius:4px;background:linear-gradient(90deg,#10264f,#1b6a78);border:1px solid var(--line);outline:none}
#thr::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--teal);border:2px solid #fff;cursor:pointer}
#thr::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--teal);border:2px solid #fff;cursor:pointer}
#launchWrap{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
#launchBtn{font-size:22px;padding:16px 46px;letter-spacing:.2em}
#launchMsg{font-size:13px;color:var(--dim);text-align:center;max-width:90vw}
#pauseV{position:absolute;inset:0;display:none;place-items:center;background:rgba(2,6,16,.6);pointer-events:auto}
#pauseV .panel{padding:26px 38px;text-align:center}
#pauseV h2{margin:0 0 14px;letter-spacing:.3em}

/* ---------- 결과 / 도움말 ---------- */
.ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(2,6,16,.72);z-index:20;padding:12px;overflow:auto}
.ov.on{display:grid}
.ov .panel{padding:22px 26px;max-width:620px;width:100%;max-height:96dvh;overflow:auto}
.ov h2{margin:0 0 4px;font-size:26px;letter-spacing:.12em}
.ov .sub{color:var(--dim);font-size:14px;margin-bottom:14px;line-height:1.55}
.ov .stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin:8px 0 14px}
.ov .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
#res.win h2{color:var(--ok)}#res.lose h2{color:var(--bad)}
.tip{margin:10px 0;padding:10px 12px;background:rgba(65,224,201,.08);border-left:3px solid var(--teal);font-size:14px;line-height:1.6}
#help table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0 12px}
#help td{padding:6px 8px;border-bottom:1px solid rgba(29,53,102,.7);vertical-align:top;line-height:1.5}
#help td:first-child{white-space:nowrap;color:var(--teal);font-weight:700;width:1%}
#help h3{margin:14px 0 6px;font-size:14px;letter-spacing:.15em;color:var(--teal)}
#help p{margin:6px 0;font-size:14px;line-height:1.65}
kbd{background:#12254f;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 7px;font-family:inherit;font-size:13px;color:#fff}
#fsBtn{position:absolute;right:10px;top:10px;z-index:5;display:block}

/* ---------- 반응형 ---------- */
@media (max-width:980px){
  #labL{width:min(380px,44vw)} #labR{width:min(280px,36vw);min-width:230px}
}
@media (max-width:760px){
  #lab.on{flex-direction:column;overflow-y:auto;padding:8px;gap:8px}
  #lab .col{width:100%!important;min-width:0!important;flex:none}
  #labM{height:36vh;order:0}#labL{order:1}#labR{order:2}
  .scroll{overflow:visible;flex:none}
  #labPreview{inset:40px 0 50px 0}
  #iL{width:150px;padding:6px 8px;font-size:11px;top:100px;left:6px}
  #iL .grp{gap:3px 6px}.m b{font-size:14px}.m.big b{font-size:19px}.m small{font-size:9px}
  #iL .hideM,#iL #vNote{display:none}
  #iR{width:132px;right:6px;top:100px}
  #missions{display:none}
  #mapBox .ml{font-size:9.5px;white-space:nowrap;padding:3px 2px 0}
  #topC{max-width:96vw;top:6px;gap:4px;width:96vw}
  #topC #tplus{font-size:18px}
  #status{font-size:12px;padding:4px 10px}
  #hint{font-size:11.5px;padding:4px 8px;max-width:96vw}
  #warn{top:330px}

    <h3>궤도에 가는 원리</h3>

    <p>1) 처음엔 똑바로 올라가 두꺼운 대기를 벗어나고, 2) 고도가 오를수록 천천히 기울여 3) 우주(100 km 이상)에서는 거의 수평으로 가속합니다. 속도가 빠른 낮은 대기에서 급히 기울이면 공기 힘 때문에 기체가 부서져요(Max-Q).</p>

/*==PHYSICS-START==*/
/* ============================================================
   물리 엔진 (렌더링과 완전히 분리) — 교육용으로 단순화한 2D 궤도 역학
   좌표계: 지구 중심이 원점, 발사대는 (0, RE). +x 방향이 '동쪽(진행 방향)'.
   ============================================================ */
const G0 = 9.80665;            // 표준 중력가속도 (Isp 계산용)
const MU = 3.986004418e14;     // 지구 중력상수 GM (m^3/s^2)
const RE = 6371000;            // 지구 반지름 (m)
const RHO0 = 1.225;            // 해수면 대기 밀도 (kg/m^3)
const HSCALE = 7200;           // 대기 규모 고도 (m) : rho = rho0 * exp(-h/H)
const KARMAN = 100000;         // 카르만선 (m)
const TARGET_ALT = 200000;     // 목표 궤도 고도 (m)
const MIN_PERIGEE = 150000;    // 안정 궤도로 인정하는 최소 근지점 고도 (m)
const SAT_MASS = 1000, FAIRING_MASS = 600, STRUCT_RATIO = 0.075;
const UPPER_THRUST = 0.22, UPPER_MASS = 0.30;   // 2단용 진공 엔진 개량형(추력/질량 비율)
const REF_AREA = 10.8;         // 로켓 단면적 (m^2)
const WARP_STEPS = [1, 2, 5, 10];

const ENGINES = [
  { id: 'eco', name: '에코 EV-1',  tag: '저추력 · 고효율', F: 1100e3, ispSL: 300, ispVac: 360, mass: 1200, color: '#41e0c9' },
  { id: 'bal', name: '밸런스 BL-3', tag: '균형형',          F: 2200e3, ispSL: 280, ispVac: 315, mass: 1900, color: '#6aa8ff' },
  { id: 'pow', name: '파워 HX-9',  tag: '고추력형',        F: 3400e3, ispSL: 255, ispVac: 285, mass: 3000, color: '#ff8a5c' }
];
const TANKS1 = [ { name: '소형', fuel: 70e3 }, { name: '중형', fuel: 110e3 }, { name: '대형', fuel: 160e3 } ];
const TANKS2 = [ { name: '소형', fuel: 8e3 },  { name: '중형', fuel: 16e3 },  { name: '대형', fuel: 26e3 } ];

function defaultDesign() { return { e1: 1, t1: 1, two: true, e2: 0, t2: 1 }; }

function atmosphere(h) {
  const hh = Math.max(0, h);
  const rho = RHO0 * Math.exp(-hh / HSCALE);
  const T = Math.max(216.65, 288.15 - 0.0065 * hh);
  return { rho, a: Math.sqrt(401.87 * T) };
}
function dragCd(mach) { return 0.26 + 0.34 * Math.exp(-Math.pow((mach - 1.1) / 0.45, 2)); }

/* 설계 → 성능 요약 (연구소 화면에서 실시간 표시) */
function vehicleStats(d) {
  const E1 = ENGINES[d.e1], E2 = ENGINES[d.e2];
  const fuel1 = TANKS1[d.t1].fuel;
  const dry1 = fuel1 * STRUCT_RATIO + E1.mass;
  const fuel2 = d.two ? TANKS2[d.t2].fuel : 0;
  const dry2 = d.two ? fuel2 * STRUCT_RATIO + E2.mass * UPPER_MASS : 0;
  const payload = SAT_MASS + FAIRING_MASS;
  const mTotal = payload + dry2 + fuel2 + dry1 + fuel1;
  const mdot1 = E1.F / (G0 * E1.ispVac);
  const thrustSL = mdot1 * G0 * E1.ispSL;
  const thrustVac = E1.F;
  const twr = thrustSL / (mTotal * G0);
  const ve1 = G0 * (0.4 * E1.ispSL + 0.6 * E1.ispVac);
  const dv1 = ve1 * Math.log(mTotal / (mTotal - fuel1));
  let dv2 = 0, thrust2 = 0, twr2 = 0;
  if (d.two) {
    const m2 = payload + dry2 + fuel2;
    thrust2 = E2.F * UPPER_THRUST;
    twr2 = thrust2 / (m2 * G0);
    dv2 = G0 * E2.ispVac * Math.log(m2 / (m2 - fuel2));
  }
  return { mTotal, fuelTotal: fuel1 + fuel2, fuel1, fuel2, dry1, dry2, payload, thrustSL, thrustVac, thrust2, twr, twr2,
           dv1, dv2, dvTotal: dv1 + dv2, burn1: fuel1 / mdot1,
           burn2: d.two ? fuel2 / (E2.F * UPPER_THRUST / (G0 * E2.ispVac)) : 0 };
}

/* 케플러 궤도 요소 */
function orbitElements(x, y, vx, vy) {
  const r = Math.hypot(x, y), v2 = vx * vx + vy * vy;
  const eps = v2 / 2 - MU / r;
  const hm = Math.abs(x * vy - y * vx);
  const e = Math.sqrt(Math.max(0, 1 + 2 * eps * hm * hm / (MU * MU)));
  const rp = hm * hm / (MU * (1 + e));
  const ra = e < 1 ? hm * hm / (MU * (1 - e)) : Infinity;
  return { r, eps, h: hm, e, rp, ra, perigeeAlt: rp - RE, apogeeAlt: ra - RE, bound: eps < 0,
           period: eps < 0 ? 2 * Math.PI * Math.sqrt(Math.pow(-MU / (2 * eps), 3) / MU) : Infinity };
}
function circularSpeed(h) { return Math.sqrt(MU / (RE + h)); }
function gravityAt(h) { return MU / Math.pow(RE + h, 2); }

function createSim(design) {
  const st = vehicleStats(design);
  return {
    design: { ...design }, st,
    phase: 'pad',            // pad → countdown → flight → (won | failed)
    cd: 10, clamp: true, hasLifted: false,
    t: 0, x: 0, y: RE, vx: 0, vy: 0,
    pitch: 0, throttle: 1, engineOn: false, ign: 0, ignDelay: 0,
    stage1: true, hasStage2: design.two,
    fuel1: st.fuel1, fuel2: st.fuel2, dry1: st.dry1, dry2: st.dry2,
    fairing: true, sat: true, satellite: null,
    debris: [], events: [],
    maxAlt: 0, maxQ: 0, maxSpeed: 0,
    missions: [false, false, false, false, false], orbitHold: 0, stableOrbit: false,
    thrustNow: 0, accNow: 0, gNow: G0, q: 0, aoa: 0, mach: 0, vr: 0, vt: 0, alt: 0, speed: 0,
    status: '발사 대기', failReason: null, autopilot: false, lowFuelWarned: [false, false],
    stageFuelEmpty: false
  };
}
function massOf(s) {
  return (s.sat ? SAT_MASS : 0) + (s.fairing ? FAIRING_MASS : 0) +
         (s.hasStage2 ? s.dry2 + s.fuel2 : 0) + (s.stage1 ? s.dry1 + s.fuel1 : 0);
}
function activeEngine(s) {
  if (s.stage1) return { stage: 1, E: ENGINES[s.design.e1], k: 1 };
  if (s.hasStage2) return { stage: 2, E: ENGINES[s.design.e2], k: UPPER_THRUST };
  return null;
}
function emit(s, type, data) { s.events.push({ type, data: data === undefined ? null : data }); }
function pushDebris(s, type, dvx, dvy, mass) {
  s.debris.push({ type, x: s.x, y: s.y, vx: s.vx + dvx, vy: s.vy + dvy, mass, rot: s.pitch, rotv: (Math.random() - 0.5) * 40, life: 0 });
}
function localFrame(x, y) { const r = Math.hypot(x, y); return { r, ux: x / r, uy: y / r, ex: y / r, ey: -x / r }; }

/* ----- 사용자 조작 (UI에서 호출) ----- */
function startCountdown(s) { if (s.phase === 'pad') { s.phase = 'countdown'; s.cd = 10; s.status = '카운트다운'; emit(s, 'countdown'); } }
function toggleEngine(s) {
  if (s.phase !== 'flight' && s.phase !== 'countdown') return;
  const ae = activeEngine(s); if (!ae) return;
  s.engineOn = !s.engineOn;
  if (s.engineOn && !s.stageFuelEmpty) emit(s, 'ignite'); else emit(s, 'cutoff');

/* ---------- 물리 이벤트 → 연출 ---------- */

        const hO = stackSections(dd, oOld).h, hN = stackSections(dd, oNew).h, rs = view.rs;
        view.shift += (hO - hN) / 2 * rs;
        const g = geom(dd), sec1 = g.bell1 + g.H1 + (dd.two ? g.inter : 0), off = (hO - sec1) / 2 * rs + 0, pr = s.pitch * Math.PI / 180;
        const db = s.debris[s.debris.length - 1];

        toast('⛓ 1단 분리 · 2단 점화 준비'); view.shk = 10; sfx.sep(); warp = 1; break;
      }
      case 'fairingSep': {

        const hO = stackSections(dd, oOld).h, hN = stackSections(dd, oNew).h, rs = view.rs;

      }
      case 'burnout': toast(ev.data === 1 ? '1단 연료 소진 — X 로 단 분리' : '2단 연료 소진', 'bad'); sfx.warn(); warp = 1; break;

        if (i === 3) { for (let k = 0; k < 4; k++) setTimeout(() => firework(W * (0.25 + Math.random() * 0.5), H * (0.15 + Math.random() * 0.25)), k * 250); }

        toast('🛰 위성 분리!'); sfx.sep(); break;
      }
      case 'msg': toast(ev.data, 'bad'); sfx.warn(); break;
      case 'win':
        view.celeb = 7; sfx.win(); saveRecord(s, true); warp = 1;
        toast('🎉 임무 성공! 위성이 궤도에 배치되었습니다', 'big');

        toast('💥 ' + (ev.data.code === 'crash' ? '추락!' : ev.data.code === 'breakup' ? '기체 파괴!' : '임무 실패'), 'bad');
        clearTimeout(resTimer); resTimer = setTimeout(() => showResult(false), 2000); break;

}

var REWARD={1:5,2:6,3:8,4:10,5:12,6:15};
var remain={};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function nextQ(g){
  if(!remain[g]||!remain[g].length){remain[g]=shuffle(BANK[g].slice());}
  return remain[g].pop();
}

/* ---------- 화면 전환 ---------- */
function show(id){
  ['menu','quiz','over','shop','pause'].forEach(function(s){$(s).classList.toggle('on',s===id);});
}
function updCoins(){var e=document.querySelectorAll('.coinval');for(var i=0;i<e.length;i++)e[i].textContent=SAVE.coins;}
function buildGrades(){
  var g=$('grades');g.innerHTML='';
  for(var n=1;n<=6;n++){(function(n){
    var b=document.createElement('button');
    b.className='btn'+(n===grade?' sel':'');
    b.innerHTML=n+'학년<small>코인 +'+REWARD[n]+'</small>';
    b.onclick=function(){grade=n;SAVE.grade=n;save();buildGrades();beep(500,0.06);};
    g.appendChild(b);
  })(n);}
}
function toMenu(){state='menu';show('menu');updCoins();buildGrades();$('sndBtn').textContent=SAVE.sound?'소리 ON':'소리 OFF';}
function startGame(){reset();state='play';show(null);}

/* ---------- 상점 ---------- */
var previews=[];
function renderShop(){
  var g=$('shopgrid');g.innerHTML='';previews=[];
  SKINS.forEach(function(sk){
    var owned=SAVE.owned.indexOf(sk.id)>=0,eq=SAVE.equipped===sk.id;
    var c=document.createElement('div');c.className='card'+(eq?' eq':'');
    var pc=document.createElement('canvas');pc.width=48;pc.height=40;
    var px=pc.getContext('2d');px.imageSmoothingEnabled=false;
    previews.push({sk:sk,px:px});
    px.drawImage(skinSprite(sk,4,0),6,0);
    var nm=document.createElement('div');nm.className='nm';nm.textContent=sk.name;
    var pr=document.createElement('div');pr.className='pr';pr.textContent=owned?'보유 중':(sk.price+' 코인');
    var b=document.createElement('button');b.className='btn'+(eq?'':' primary');
    if(eq){b.textContent='장착 중';b.disabled=true;}
    else if(owned){b.textContent='장착하기';b.onclick=function(){SAVE.equipped=sk.id;save();renderShop();beep(600,0.08);};}
    else{
      b.textContent='구매하기';
      if(SAVE.coins<sk.price)b.disabled=true;
      b.onclick=function(){
        if(SAVE.coins>=sk.price){SAVE.coins-=sk.price;SAVE.owned.push(sk.id);SAVE.equipped=sk.id;save();updCoins();renderShop();beep(660,0.1);setTimeout(function(){beep(990,0.15);},100);}
      };
    }
    c.appendChild(pc);c.appendChild(nm);c.appendChild(pr);c.appendChild(b);g.appendChild(c);
  });
  updCoins();
}
function openShop(){state='shop';show('shop');renderShop();}

/* ---------- 퀴즈 ---------- */
function openQuiz(){
  state='quiz';
  var q=nextQ(grade);
  var opts=shuffle(q[1].map(function(txt,i){return {txt:txt,ok:i===0};}));
  $('qtag').textContent=grade+'학년 과학 퀴즈 · 정답 시 코인 +'+REWARD[grade];
  $('qtext').textContent=q[0];
  $('fb').innerHTML='';$('nextBtn').style.display='none';
  var o=$('opts');o.innerHTML='';
  var done=false;
  opts.forEach(function(op,idx){
    var b=document.createElement('button');b.className='btn';b.textContent=(idx+1)+'. '+op.txt;
    b.onclick=function(){
      if(done)return;done=true;
      var all=o.querySelectorAll('.btn');
      for(var k=0;k<all.length;k++){all[k].disabled=true;if(opts[k].ok)all[k].classList.add('ok');}
      if(op.ok){
        SAVE.coins+=REWARD[grade];runCoins+=REWARD[grade];solved++;save();
        $('fb').innerHTML='<b>정답! 코인 +'+REWARD[grade]+'</b><br>'+q[2];
        beep(660,0.1);setTimeout(function(){beep(880,0.18);},110);
      }else{
        b.classList.add('no');
        $('fb').innerHTML='<b>아쉬워요!</b> 정답은 초록색이에요.<br>'+q[2];
        beep(160,0.3,'sawtooth');
      }
      for(var k2=0;k2<all.length;k2++){all[k2].style.opacity=1;}
      $('nextBtn').style.display='block';
    };
    o.appendChild(b);
  });
  show('quiz');
}
function closeQuiz(){
  obs=[];invuln=1.5;state='play';show(null);
}

/* ---------- 게임 오버 ---------- */
function gameOver(){
  state='over';
  $('stats').innerHTML='선택 학년 <b>'+grade+'학년</b><br>생존 시간 <b>'+Math.floor(t)+'초</b><br>맞힌 문제 <b>'+solved+'개</b><br>이번 판 획득 코인 <b>'+runCoins+'</b>';
  updCoins();show('over');
  beep(200,0.4,'sawtooth');
}

/* ---------- 입력 ---------- */
window.addEventListener('keydown',function(e){
  var k=e.key;
  if((k==='f'||k==='F')&&!e.ctrlKey&&!e.metaKey){toggleFs();}
  if(k==='Escape'||k==='p'||k==='P'){if(state==='play')pauseGame();else if(state==='pause')resumeGame();}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(k)>=0)e.preventDefault();
  keys[k.toLowerCase()]=true;
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
function pointerMove(e){
  if(state!=='play')return;
  var r=cv.getBoundingClientRect();
  ptX=(e.clientX-r.left)/r.width*W;
}
cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(state==='play'&&x<48&&y>24&&y<58){pauseGame();return;}
  pointerMove(e);
});
cv.addEventListener('pointermove',pointerMove);
cv.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});

/* ---------- 게임 로직 ---------- */
function rnd(a,b){return a+Math.random()*(b-a);}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function burst(x,y,col,n){for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:rnd(-90,90),vy:rnd(-90,90),l:rnd(0.3,0.7),c:col,s:rnd(2,4)});}

function spawnObs(){
  var base=Math.min(280,100+grade*10+t*2.5);
  if(Math.random()<0.25){
    obs.push({type:'ufo',bx:rnd(40,W-76),x:0,y:-30,w:36,h:24,vy:base*0.8,ph:rnd(0,6)});
  }else{
    var s=3+Math.floor(Math.random()*3);
    obs.push({type:'rock',s:s,x:rnd(0,W-s*10),y:-s*10,w:s*10,h:s*10,vy:base*rnd(0.8,1.25)});
  }
}

function update(dt){
  // 별
  stars.forEach(function(s){s.y+=s.v*dt*(state==='play'?1:0.4);if(s.y>H){s.y=-2;s.x=Math.random()*W;}});
  parts=parts.filter(function(p){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;return p.l>0;});
  if(state!=='play')return;
  t+=dt;score+=dt*10;
  if(invuln>0)invuln-=dt;
  if(shake>0)shake-=dt;

  // 이동
  var sp=250,moved=false;
  if(keys['arrowleft']||keys['a']){player.x-=sp*dt;moved=true;}
  if(keys['arrowright']||keys['d']){player.x+=sp*dt;moved=true;}
  if(moved)ptX=null;
  if(ptX!==null)player.x+=(ptX-player.x)*Math.min(1,dt*14);
  player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));

  // 생성
  spawnT-=dt;
  if(spawnT<=0){spawnObs();spawnT=Math.max(0.3,0.95-grade*0.04-t*0.008);}
  boxT-=dt;
  if(boxT<=0){boxes.push({x:rnd(20,W-60),y:-40,w:40,h:40,vy:85,ph:rnd(0,6)});boxT=7;}

  var pb={x:player.x-player.w/2+4,y:player.y+3,w:player.w-8,h:player.h-6};

  obs.forEach(function(o){
    o.y+=o.vy*dt;
    if(o.type==='ufo')o.x=o.bx+Math.sin(t*3+o.ph)*40;
  });
  obs=obs.filter(function(o){return o.y<H+10;});
  if(invuln<=0){
    for(var i=0;i<obs.length;i++){
      var o=obs[i];
      var ob={x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-8};
      if(hit(pb,ob)){
        lives--;invuln=1.5;shake=0.25;
        burst(player.x,player.y+10,'#ff6a3d',14);beep(110,0.25,'sawtooth');
        obs.splice(i,1);
        if(lives<=0){gameOver();return;}
        break;
      }
    }
  }

  // 상자
  for(var j=boxes.length-1;j>=0;j--){
    var b=boxes[j];b.y+=b.vy*dt;
    if(b.y>H+10){boxes.splice(j,1);continue;}
    if(hit(pb,b)){
      boxes.splice(j,1);burst(b.x+20,b.y+20,'#ffd23f',16);beep(520,0.12);
      openQuiz();return;
    }
  }
}

/* ---------- 그리기 ---------- */
function draw(){
  var sx=0,sy=0;
  if(shake>0){sx=rnd(-3,3);sy=rnd(-3,3);}
  ctx.save();ctx.translate(sx,sy);
  ctx.fillStyle='#0b1030';ctx.fillRect(-5,-5,W+10,H+10);
  stars.forEach(function(s){ctx.fillStyle=s.s===3?'#5de6ff':'#ffffff';ctx.globalAlpha=s.s===1?0.5:0.9;ctx.fillRect(Math.round(s.x),Math.round(s.y),s.s,s.s);});
  ctx.globalAlpha=1;

  // 장애물
  obs.forEach(function(o){
    if(o.type==='ufo')ctx.drawImage(sUfo,Math.round(o.x),Math.round(o.y));
    else ctx.drawImage(rockSprite(o.s),Math.round(o.x),Math.round(o.y));
  });
  // 상자
  boxes.forEach(function(b){
    var bob=Math.sin(frame*0.1+b.ph)*2;
    ctx.drawImage(sBox,Math.round(b.x),Math.round(b.y+bob));
  });
  // 비행기
  if(state==='play'||state==='quiz'||state==='over'||state==='pause'){
    var blink=state==='play'&&invuln>0&&Math.floor(invuln*10)%2===0;
    if(!blink&&!(state==='over')){
      var sk=skinById(SAVE.equipped);
      ctx.drawImage(skinSprite(sk,3,frame),Math.round(player.x-18),Math.round(player.y));
      // 불꽃
      var fl=(frame%6<3)?8:14;
      ctx.fillStyle='#ff6a3d';ctx.fillRect(Math.round(player.x-9),Math.round(player.y+30),6,fl);ctx.fillRect(Math.round(player.x+3),Math.round(player.y+30),6,fl);
      ctx.fillStyle='#ffe14d';ctx.fillRect(Math.round(player.x-8),Math.round(player.y+30),3,fl-5);ctx.fillRect(Math.round(player.x+4),Math.round(player.y+30),3,fl-5);
    }
  }else{
    // 메인 화면 배경용 비행기
    ctx.drawImage(skinSprite(skinById(SAVE.equipped),3,frame),Math.round(W/2-18+Math.sin(frame*0.03)*60),H-70);
  }
  // 파티클
  parts.forEach(function(p){ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);});
  ctx.restore();

  // HUD
  if(state==='play'||state==='quiz'||state==='pause'){
    for(var i=0;i<lives;i++)ctx.drawImage(sHeart,8+i*18,8);
    ctx.drawImage(sCoin,W-92,6);
    ctx.fillStyle='#ffd23f';ctx.font='bold 14px Galmuri11, sans-serif';ctx.textBaseline='top';
    ctx.textAlign='left';ctx.fillText(String(SAVE.coins),W-72,8);
    ctx.fillStyle='#5de6ff';ctx.textAlign='center';ctx.fillText(grade+'학년  '+Math.floor(score),W/2,8);
    if(state==='play'){ctx.globalAlpha=0.7;ctx.fillStyle='#ffffff';ctx.fillRect(10,30,5,16);ctx.fillRect(19,30,5,16);ctx.globalAlpha=1;}
  }
}

function loop(){
  frame++;
  var now=performance.now();
  var dt=Math.min(0.05,(now-(loop.last||now))/1000);loop.last=now;
  update(dt);draw();
  if(state==='shop'&&frame%3===0){
    previews.forEach(function(p){if(p.sk.rainbow){p.px.clearRect(0,0,48,40);p.px.drawImage(skinSprite(p.sk,4,frame),6,0);}});
  }
  requestAnimationFrame(loop);
}

/* ---------- 버튼 ---------- */
$('startBtn').onclick=startGame;
$('shopBtn').onclick=openShop;
$('sndBtn').onclick=function(){SAVE.sound=!SAVE.sound;save();$('sndBtn').textContent=SAVE.sound?'소리 ON':'소리 OFF';beep(500,0.06);};
$('nextBtn').onclick=closeQuiz;

$('backBtn').onclick=toMenu;

$('pMenuBtn').onclick=toMenu;
$('pExitBtn').onclick=exitApp;
$('exitBtn').onclick=exitApp;

function toggleFs(){
  var host=null;
  try{ if(window.parent!==window && window.parent.document) host=window.parent.document; }catch(e){}
  var d=host||document, el=d.documentElement;
  try{
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
    else{var rq=el.requestFullscreen||el.webkitRequestFullscreen; if(rq){var p=rq.call(el); if(p&&p.catch)p.catch(function(){});}}
  }catch(e){}
}
$('fsBtn').onclick=toggleFs;
if($('pFsBtn'))$('pFsBtn').onclick=toggleFs;
var fsOk=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||(window.parent!==window));
if(!fsOk){$('fsBtn').style.display='none';if($('pFsBtn'))$('pFsBtn').style.display='none';}
var embedded=(window.parent!==window);
if(!embedded){$('exitBtn').style.display='none';$('pExitBtn').style.display='none';}
function exitApp(){try{parent.postMessage({quviaGalaxy:'exit'},'*');}catch(e){}}
function pauseGame(){if(state!=='play')return;state='pause';show('pause');}
function resumeGame(){if(state!=='pause')return;state='play';show(null);}
toMenu();
requestAnimationFrame(loop);
})();

  "천구의 회전에 관하여": "코페르니쿠스는 지구가 아니라 태양이 우주의 중심이고, 지구를 포함한 행성들이 태양 주위를 돈다는 지동설을 체계적으로 정리했다. 당시 널리 받아들여지던 천동설에 정면으로 도전한 이 책은 근대 과학혁명의 출발점으로 평가받는다.",
  "행성운동 법칙": "케플러는 티코 브라헤가 남긴 방대한 관측 자료를 분석해, 행성이 원이 아니라 타원 궤도로 태양 주위를 돈다는 것과 그 속도가 태양에 가까울수록 빨라진다는 규칙을 발견했다. 이 법칙들은 훗날 뉴턴이 만유인력 법칙을 세우는 데 결정적인 단서가 되었다.",
  "은하의 적색편이-거리 관계": "허블은 여러 은하까지의 거리와 그 은하에서 오는 빛이 얼마나 붉게 치우쳐 보이는지(적색편이)를 측정했다. 그 결과 은하가 멀리 있을수록 더 빠르게 멀어진다는 규칙을 발견했는데, 이는 우주 자체가 팽창하고 있다는 강력한 증거였다.",
  "암흑물질 존재 제안": "츠비키는 은하단 속 은하들이 서로를 끌어당기는 중력만으로는 그렇게 빠르게 움직이는 게 설명되지 않는다는 것을 알아챘다. 그는 눈에 보이지 않는 추가적인 질량이 존재할 것이라 제안했는데, 이것이 오늘날 암흑물질 개념의 시초다.",
  "백색왜성 질량 한계": "찬드라세카르는 별이 수명을 다한 뒤 남는 백색왜성이 버틸 수 있는 질량에 한계가 있다는 것을 계산으로 밝혔다. 이 한계를 넘는 별은 백색왜성으로 안정될 수 없고 결국 초신성 폭발이나 중성자별, 블랙홀로 이어진다는 이론의 기초가 되었다.",
  "우주배경복사 발견": "펜지어스와 윌슨은 원래 통신용 안테나의 잡음을 없애려다가, 하늘 어느 방향에서나 똑같이 감지되는 정체불명의 약한 전파를 발견했다. 이는 빅뱅 직후 뜨거웠던 우주가 식으면서 남긴 '잔광'으로 밝혀졌고, 빅뱅 이론을 뒷받침하는 결정적 증거가 되었다.",
  "은하 회전곡선 관측": "루빈과 포드는 은하 안의 별들이 중심에서 얼마나 떨어져 있든 거의 비슷한 속도로 돌고 있다는 것을 관측했다. 보이는 물질만으로는 이 속도를 설명할 수 없어, 은하 전체에 눈에 보이지 않는 암흑물질이 퍼져 있어야 한다는 강력한 증거가 되었다.",
  "특이점 정리": "호킹과 펜로즈는 일반상대성이론을 수학적으로 분석해, 특정 조건에서는 밀도와 중력이 무한대에 가까워지는 지점(특이점)이 반드시 생겨난다는 것을 증명했다. 이는 블랙홀 중심뿐 아니라 우주가 시작된 순간에도 적용되는 결과였다.",
  "공룡 멸종 소행성 충돌설": "알바레즈 부자는 약 6600만 년 전 지층에서 지구에는 드물고 소행성에는 흔한 이리듐이 비정상적으로 많이 쌓여 있는 것을 발견했다. 이를 근거로 거대한 소행성 충돌이 공룡을 포함한 대멸종을 일으켰다는 가설을 제시했고, 이후 실제 충돌 흔적(멕시코 칙술루브 분화구)이 확인되며 정설로 자리잡았다.",
  "우주팽창 가속 발견": "연구팀은 아주 멀리 있는 초신성의 밝기를 정밀하게 측정해 우주의 팽창 속도가 시간이 지날수록 오히려 빨라지고 있다는 것을 발견했다. 중력만 작용한다면 팽창은 느려져야 하는데 반대의 결과가 나오면서, 우주를 밀어내는 정체불명의 '암흑에너지' 개념이 등장했다.",
  "블랙홀 최초 촬영": "전 세계에 흩어진 여러 전파망원경을 지구 크기만 한 하나의 가상 망원경처럼 연결하는 기술을 이용해, 거대 은하 M87 중심에 있는 블랙홀의 그림자를 촬영하는 데 성공했다. 블랙홀의 존재를 이론이 아니라 실제 영상으로 확인한 최초의 사례다.",

  "질량보존 법칙": "라부아지에는 밀폐된 용기 안에서 화학 반응이 일어나기 전과 후의 물질 무게를 정밀하게 측정해, 반응 과정에서 물질이 사라지거나 새로 생기지 않고 형태만 바뀐다는 것을 확인했다. 이는 화학을 정성적인 관찰에서 정량적인 과학으로 바꾼 전환점이었다.",
  "주기율표": "멘델레예프는 당시 알려진 원소들을 원자량 순서로 배열하다가 성질이 비슷한 원소들이 일정한 간격으로 반복된다는 규칙을 발견했다. 그는 이 표에 빈칸을 남겨두고 아직 발견되지 않은 원소의 성질까지 예측했는데, 이후 실제로 발견되며 이론의 정확성이 입증되었다.",
  "라듐과 폴로늄 발견": "퀴리 부부는 우라늄 광석에서 우라늄보다 훨씬 강한 방사능을 내는 물질이 있다는 것을 알아채고, 힘든 정제 과정을 거쳐 새로운 원소인 폴로늄과 라듐을 분리해냈다. 이 연구는 방사능이라는 현상 자체를 과학적으로 규명하는 데 크게 기여했다.",
  "화학결합의 본질": "폴링은 원자마다 전자를 끌어당기는 힘의 세기(전기음성도)가 다르다는 개념을 도입해, 원자들이 왜 특정한 방식으로 결합하는지를 체계적으로 설명했다. 이 이론은 오늘날에도 화학 결합을 이해하는 기본 틀로 쓰인다.",
  "DNA X선 회절 사진": "프랭클린과 고슬링은 DNA 섬유에 X선을 쏘아 얻은 회절무늬(사진 51번)를 통해 DNA가 나선 형태이며 두 가닥으로 이루어져 있다는 것을 보여주는 결정적인 실험 데이터를 확보했다. 이 사진은 왓슨과 크릭이 이중나선 구조를 완성하는 데 핵심 단서가 되었다.",
  "DNA 이중나선 구조": "왓슨과 크릭은 여러 실험 데이터(특히 프랭클린의 X선 사진)를 종합해, DNA가 두 가닥이 서로 꼬인 나선 모양이며 각 가닥의 염기가 짝을 이루어 마주보고 있다는 구조 모델을 제안했다. 이 구조는 유전정보가 어떻게 저장되고 복제될 수 있는지를 자연스럽게 설명해주었다.",
  "DNA 염기서열 분석법": "생어는 DNA 가닥을 특정 위치에서 끊어지도록 만드는 화학적 방법을 개발해, DNA를 이루는 염기들의 순서를 하나하나 읽어낼 수 있게 했다. 이 '생어 시퀀싱' 기술은 이후 수십 년간 유전체 연구의 표준 도구가 되었다.",
  "PCR 기술 개발": "멀리스는 온도를 반복적으로 오르내리며 효소를 이용해 DNA의 특정 부분만 기하급수적으로 복제하는 방법을 고안했다. 극소량의 DNA만으로도 유전자 검사, 친자 확인, 감염병 진단(PCR 검사) 등이 가능해진 것은 모두 이 기술 덕분이다.",
  "오존층 파괴 규명": "몰리나와 롤런드는 냉장고나 스프레이에 쓰이던 프레온가스(CFC)가 대기 상층까지 올라가 자외선에 분해되면서 오존 분자를 파괴하는 연쇄 반응을 일으킨다는 것을 계산으로 밝혔다. 이 연구는 이후 오존층 보호를 위한 국제 협약(몬트리올 의정서) 체결로 이어졌다.",

  "종의 기원": "다윈은 여러 해에 걸친 관찰과 비글호 항해 경험을 바탕으로, 환경에 더 잘 적응한 개체가 더 많은 자손을 남기며 그 형질이 다음 세대로 퍼져나가는 '자연선택'을 통해 생물이 서서히 변화해간다는 이론을 정리했다. 생명의 다양성을 신의 개별 창조가 아닌 자연적 과정으로 설명한 최초의 체계적 이론이었다.",
  "식물 잡종 연구": "멘델은 수년간 완두콩을 교배하며 씨의 모양, 색깔 같은 형질이 자손에게 어떤 비율로 나타나는지를 꼼꼼히 기록했다. 이를 통해 형질이 독립된 단위(오늘날의 유전자)로 전달되며, 우열 관계와 일정한 비율로 분리된다는 유전의 기본 법칙을 발견했다.",
  "하디-바인베르크 평형": "하디와 바인베르크는 각자 독립적으로, 특정 조건(무작위 짝짓기, 돌연변이나 자연선택이 없는 등)에서는 한 집단 안의 유전자형 비율이 세대가 지나도 변하지 않고 일정하게 유지된다는 것을 수학적으로 보였다. 이는 진화가 일어나려면 어떤 조건이 깨져야 하는지를 이해하는 기준점이 되었다.",
  "자연선택의 유전학적 이론": "피셔는 멘델의 유전법칙과 다윈의 자연선택 이론이 서로 모순되지 않으며, 오히려 유전학이 자연선택이 어떻게 작동하는지를 수학적으로 뒷받침한다는 것을 보였다. 이 연구는 서로 갈라져 있던 유전학과 진화생물학을 하나로 통합하는 '현대적 종합'의 토대가 되었다.",
  "전이인자 발견": "매클린톡은 옥수수 알갱이의 색 무늬를 연구하다가, 특정 유전 요소가 염색체 안에서 위치를 스스로 옮겨 다니며 다른 유전자의 작동을 켜고 끌 수 있다는 것을 발견했다. 당시에는 파격적으로 여겨졌던 이 발견은 훗날 '전이인자(트랜스포존)'로 불리며 유전체 연구의 중요한 개념이 되었다.",
  "세균 돌연변이 실험": "루리아와 델브뤼크는 세균이 바이러스에 저항성을 갖게 되는 과정을 분석해, 이 저항성 돌연변이가 바이러스에 노출된 '이후'에 생기는 게 아니라 노출되기 전부터 무작위로 이미 존재하고 있었다는 것을 통계적으로 증명했다. 이는 돌연변이가 환경에 반응해서가 아니라 무작위로 일어난다는 것을 처음 명확히 보인 실험이다.",
  "형질전환 물질 연구": "에이버리, 매클라우드, 매카시는 죽은 병원성 세균의 어떤 성분이 무해한 세균을 병원성으로 바꾸는지를 추적한 끝에, 그 정체가 단백질이 아니라 DNA라는 것을 밝혔다. 당시 많은 과학자들이 유전물질은 단백질일 것이라 생각했기에, 이 연구는 DNA가 유전정보를 담고 있다는 최초의 직접적 증거였다.",
  "박테리오파지 실험": "허시와 체이스는 세균을 감염시키는 바이러스(박테리오파지)의 단백질 껍질과 내부 DNA에 서로 다른 방사성 표지를 붙여 실험했다. 세균 안으로 실제 들어가 다음 세대를 만드는 것은 DNA뿐이라는 것을 보여주면서, DNA가 유전물질이라는 사실을 다시 한번 확실히 뒷받침했다.",
  "DNA 반보존적 복제 실험": "메셀슨과 스탈은 질소의 서로 다른 동위원소를 이용해 DNA를 표지한 뒤, DNA가 복제될 때마다 원래 가닥 하나와 새로 만들어진 가닥 하나가 짝을 이룬다는 것을 실험으로 확인했다. 이는 DNA 복제 방식에 대한 여러 가설 중 왓슨과 크릭이 예측했던 방식이 맞다는 것을 증명한 '아름다운 실험'으로 꼽힌다.",
  "헤모글로빈 구조 규명": "퍼루츠와 켄드루는 X선 결정학이라는 기법을 이용해 헤모글로빈과 미오글로빈이라는 단백질의 3차원 원자 구조를 처음으로 완전히 밝혀냈다. 이는 단백질이 어떻게 산소를 운반하고 저장하는지를 구조적으로 이해하게 해준, 구조생물학이라는 분야를 연 연구였다.",
  "단백질 접힘 원리": "안핀센은 단백질을 인위적으로 풀었다가 다시 원래 환경으로 돌려놓으면 스스로 원래의 3차원 구조로 다시 접힌다는 것을 실험으로 보였다. 이는 단백질의 최종 구조가 오직 아미노산이 배열된 순서만으로 결정된다는 것을 보여주며, 단백질 구조 예측 연구의 이론적 기초가 되었다.",
  "오페론 모델": "제이콥과 모노는 대장균이 주변에 특정 영양분이 있을 때만 그것을 분해하는 효소를 만든다는 것을 관찰하고, 유전자 앞에 있는 조절 부위가 스위치처럼 유전자 발현을 켜고 끌 수 있다는 오페론 모델을 제안했다. 이는 세포가 필요할 때만 유전자를 선택적으로 사용한다는 유전자 발현 조절 개념을 처음 명확히 보여주었다.",
  "유전암호 해독": "니런버그와 마테이는 인공적으로 합성한 RNA를 이용한 실험을 통해, RNA의 염기 세 개가 한 조가 되어 특정 아미노산 하나를 지정한다는 유전암호(코돈)의 규칙을 처음으로 밝혀냈다. 이로써 DNA에 적힌 정보가 어떻게 실제 단백질로 번역되는지의 마지막 퍼즐이 맞춰졌다.",
  "세포내공생설": "마굴리스는 세포 속 미토콘드리아와 엽록체가 원래는 독립적으로 살던 세균이었는데, 아주 오래전 더 큰 세포에 삼켜진 뒤 서로에게 이롭게 공생하게 되면서 세포의 일부가 되었다는 이론을 제시했다. 당시에는 많은 반대에 부딪혔지만, 이후 유전자 분석 결과들이 이 이론을 강력하게 뒷받침하면서 정설로 자리잡았다.",
  "역전사효소 발견": "테민과 볼티모어는 각자 독립적으로, 일부 바이러스(RNA 바이러스)가 자신의 RNA 정보를 숙주 세포의 DNA로 거꾸로 옮겨 쓸 수 있다는 것을 발견했다. 이는 유전정보가 항상 DNA에서 RNA로만 흐른다는 당시의 '중심원리'를 수정하게 만든 발견이었고, 이후 HIV 같은 바이러스의 작동 원리를 이해하는 데도 핵심이 되었다.",
  "유전자 재조합 기술": "보이어와 코헨은 한 생물의 DNA 조각을 잘라 다른 생물의 DNA(플라스미드)에 끼워넣어 세균이 원래 없던 단백질을 만들어내게 하는 데 성공했다. 이는 유전자를 인위적으로 조합하는 유전공학 기술의 시작이었으며, 이후 인슐린 같은 의약품을 세균으로 대량 생산하는 산업으로 이어졌다.",
  "생물 3역 분류체계": "워스는 여러 생물의 리보솜 RNA 서열을 비교 분석하다가, 겉보기엔 세균과 비슷해 보이던 일부 미생물이 유전적으로는 세균과 크게 다르다는 것을 발견했다. 이를 근거로 생물을 세균, 고세균, 진핵생물이라는 세 개의 큰 가지로 재분류할 것을 제안했다.",
  "프리온 가설": "프루지너는 광우병 같은 신경계 질환이 DNA나 RNA 같은 유전물질 없이 비정상적으로 접힌 단백질(프리온) 자체만으로도 전염될 수 있다는, 당시로서는 매우 파격적인 가설을 제시했다. 이 단백질이 정상 단백질과 접촉해 자신과 같은 비정상 형태로 바꿔버린다는 것이 이후 연구로 뒷받침되었다.",
  "텔로머레이스 발견": "블랙번, 그라이더, 조스택은 염색체 끝부분(텔로미어)이 세포 분열마다 조금씩 짧아진다는 사실과, 이를 다시 늘려주는 효소(텔로머레이스)가 존재한다는 것을 발견했다. 이 연구는 세포 노화와 암세포가 무한히 분열하는 원리를 이해하는 데 중요한 실마리를 제공했다.",
  "CRISPR-Cas9": "연구팀은 세균이 바이러스의 DNA 조각을 기억해두었다가 다시 침입하면 잘라내는 면역 시스템(CRISPR)을 발견하고, 이를 이용해 원하는 DNA 서열을 정확한 위치에서 자를 수 있는 도구로 재설계했다. 기존보다 훨씬 쉽고 저렴하게 유전자를 편집할 수 있게 되면서 생명과학 전반에 큰 변화를 가져왔다.",
  "유도만능줄기세포": "야마나카는 이미 피부세포 등으로 완전히 성장한 체세포에 특정 유전자 몇 개를 넣어주는 것만으로, 그 세포를 배아줄기세포와 비슷하게 어떤 세포로도 분화할 수 있는 상태로 되돌릴 수 있다는 것을 발견했다. 이는 배아를 사용하지 않고도 환자 맞춤형 세포를 만들 수 있는 길을 열어 재생의학 연구에 큰 전환점이 되었다.",
  "인간 게놈 초안 서열": "여러 나라의 연구기관이 참여한 대규모 국제 프로젝트를 통해, 인간의 DNA 약 30억 개 염기쌍 전체의 서열을 최초로 해독해 공개했다. 이는 인간 유전자가 어디에 몇 개나 있는지를 지도처럼 보여주며, 이후 개인 유전체 분석과 정밀의료 발전의 기반이 되었다.",

  "천연두 백신 실험": "제너는 소젖을 짜던 여성들이 소의 가벼운 질병인 우두에 걸리고 나면 훨씬 치명적인 천연두에는 잘 걸리지 않는다는 사실에 주목했다. 그는 우두 고름을 소년에게 접종한 뒤 실제 천연두에 노출시키는 실험을 통해 면역이 생긴다는 것을 확인했고, 이는 인류 최초의 백신으로 기록되었다.",
  "백조목 플라스크 실험": "파스퇴르는 목이 S자처럼 휘어져 외부 먼지는 막으면서도 공기는 통하는 특수한 플라스크를 이용해, 끓여서 소독한 액체가 밀폐된 병 속에서는 아무리 오래 두어도 미생물이 저절로 생기지 않는다는 것을 보였다. 이는 생명이 무생물에서 저절로 생겨난다는 자연발생설을 실험으로 반박한 결정적 연구였다.",
  "코흐의 4원칙": "코흐는 특정 미생물이 특정 질병의 원인이라고 확실히 말하려면 어떤 조건을 만족해야 하는지 정리한 네 가지 기준을 제시했다(병에 걸린 개체에서 그 균이 검출되어야 하고, 분리해 배양할 수 있어야 하며, 건강한 개체에 넣었을 때 같은 병을 일으켜야 하고, 다시 그 개체에서 같은 균이 검출되어야 한다). 이 기준은 오늘날까지도 감염병의 원인균을 확정하는 표준 절차로 쓰인다.",
  "페니실린 발견": "플레밍은 세균 배양 접시를 정리하다가, 곰팡이가 우연히 피어난 자리 주변에서는 세균이 자라지 못한 것을 발견했다. 그 곰팡이가 만들어내는 물질(페니실린)이 세균을 죽인다는 것을 알아낸 이 우연한 관찰은, 이후 대량 생산되어 수많은 생명을 구한 항생제 시대를 열었다.",
  "인슐린 발견": "밴팅과 베스트는 췌장에서 혈당을 조절하는 물질을 분리해내는 데 성공했고, 이를 당뇨병으로 죽어가던 환자에게 투여해 극적으로 상태가 호전되는 것을 확인했다. 이 발견 덕분에 그전까지는 사실상 사형선고나 다름없던 1형 당뇨병이 관리 가능한 질환이 되었다.",
  "소아마비 백신 개발": "소크는 바이러스를 비활성화시켜 주사하는 방식의 백신을, 세이빈은 약화된 살아있는 바이러스를 먹는 방식의 백신을 각각 개발했다. 두 백신이 전 세계적으로 보급되면서 한때 수많은 어린이를 마비시켰던 소아마비 발병률이 극적으로 감소했다.",
  "흡연-폐암 관계 규명": "도일과 힐은 수많은 환자들의 흡연 습관과 폐암 발병 여부를 비교 분석하는 대규모 역학조사를 실시해, 담배를 많이 피울수록 폐암 위험이 뚜렷하게 높아진다는 것을 통계적으로 입증했다. 이 연구는 이후 금연 정책과 담배 규제의 과학적 근거가 되었다.",
  "신경전달물질 발견": "뢰비는 개구리 심장 두 개를 이용한 실험에서, 한쪽 심장의 신경을 자극했을 때 나온 액체를 다른 심장에 옮겼더니 그 심장도 똑같이 반응하는 것을 관찰했다. 이는 신경 신호가 순전히 전기적으로만 전달되는 것이 아니라 화학물질(아세틸콜린)을 통해서도 전달된다는 것을 처음 증명한 실험이었다.",
  "헬리코박터균과 위궤양": "마셜과 워런은 오랫동안 스트레스나 위산 과다가 원인으로 여겨지던 위궤양이 사실은 헬리코박터 파일로리라는 세균 감염 때문일 수 있다는 것을 보였다. 마셜은 이를 증명하기 위해 직접 이 균을 삼켜 위염을 일으키는 극적인 실험까지 감행한 것으로 유명하다.",
  "HIV 발견": "바레시누시와 몽타니에가 이끄는 연구팀은 에이즈 환자의 림프절에서 면역세포를 파괴하는 새로운 바이러스를 분리해내는 데 성공했다. HIV의 정체를 규명한 이 연구는 이후 에이즈 진단법과 치료제 개발의 출발점이 되었다.",
  "mRNA 변형 기술": "카리코와 와이스먼은 외부에서 넣은 mRNA가 우리 몸의 면역계에 의해 즉시 파괴되거나 과도한 염증 반응을 일으키는 문제를 해결하기 위해, mRNA를 구성하는 물질 일부를 화학적으로 변형하는 방법을 개발했다. 이 기술 덕분에 mRNA를 안전하게 세포에 전달할 수 있게 되었고, 이는 코로나19 mRNA 백신이 빠르게 개발될 수 있었던 핵심 토대였다.",

  "뉴런 이론 확립": "카할은 새로 개발된 염색 기법을 이용해 신경조직을 관찰하고, 신경계가 서로 연결되어 하나로 이어진 그물이 아니라 개별적인 세포(뉴런)들이 접촉해 신호를 주고받는 구조라는 것을 정교한 그림으로 보여주었다. 이 뉴런 이론은 현대 신경과학의 기본 전제가 되었다.",
  "시각피질 연구": "허블과 비셀은 고양이의 뇌에 미세한 전극을 꽂아, 시각피질의 특정 신경세포가 특정한 방향의 선이나 움직임에만 반응한다는 것을 발견했다. 이는 뇌가 눈으로 들어온 시각 정보를 단계적으로 분석해 처리한다는 것을 실험으로 보여준 중요한 연구였다.",
  "활동전위 이온 모델": "호지킨과 헉슬리는 오징어의 거대한 신경세포를 이용한 실험으로, 신경세포 안팎을 드나드는 나트륨과 칼륨 이온의 움직임이 신경 신호(활동전위)를 만들어내는 정확한 과정을 수학적 방정식으로 밝혀냈다. 이는 신경 신호 전달의 물리적 원리를 정량적으로 설명한 최초의 연구였다.",
  "분리뇌 연구": "스페리는 좌뇌와 우뇌를 연결하는 신경다발이 절단된 환자들을 연구해, 두 반구가 각각 다른 방식으로 정보를 처리하고 서로 다른 역할(예: 언어와 공간 인식)을 담당한다는 것을 밝혀냈다. 이 연구는 뇌의 기능이 좌우로 나뉘어 있다는 '좌뇌·우뇌' 개념이 널리 퍼지는 계기가 되었다.",
  "군소 신경계 연구": "캔델은 신경세포 수가 적고 크기가 커서 관찰이 쉬운 바다달팽이(군소)를 이용해, 간단한 학습이 반복될 때 신경세포 사이의 연결(시냅스)이 실제로 강해지거나 약해진다는 것을 보였다. 이는 기억이 뇌 속에서 물리적으로 어떻게 저장되는지를 세포 수준에서 처음 밝혀낸 연구였다.",

  "대륙과 해양의 기원": "베게너는 남아메리카와 아프리카 대륙의 해안선이 퍼즐처럼 맞아떨어지고, 서로 멀리 떨어진 대륙에서 같은 종류의 화석과 지층이 발견된다는 점에 주목했다. 그는 원래 하나였던 거대한 대륙이 서서히 갈라져 지금의 위치로 이동했다는 대륙이동설을 제시했으며, 이는 훗날 판구조론으로 발전해 지질학의 근본 틀이 되었다.",
  "온실효과 계산": "아레니우스는 대기 중 이산화탄소 농도가 변하면 지구가 우주로 내보내는 열의 양이 달라진다는 원리에 착안해, 이산화탄소 농도와 지구 평균기온 사이의 관계를 직접 계산해냈다. 컴퓨터도 없던 시절 손으로 계산했다는 점에서 놀라운 연구이며, 오늘날 기후변화 과학의 이론적 뿌리로 평가받는다.",
  "킬링 곡선": "킬링은 하와이 마우나로아 관측소에서 대기 중 이산화탄소 농도를 매우 정밀하고 꾸준하게 측정하기 시작했다. 수십 년간 쌓인 이 기록은 이산화탄소 농도가 계절에 따라 오르내리면서도 전체적으로 꾸준히 상승하고 있다는 것을 명확한 그래프로 보여준 최초의 장기 관측 자료였다.",
  "밀란코비치 주기 이론": "밀란코비치는 지구가 태양 주위를 도는 궤도의 모양, 자전축의 기울기, 자전축이 흔들리는 정도가 각각 다른 주기로 서서히 변한다는 점을 계산해, 이 변화들이 지구에 도달하는 햇빛의 양과 분포를 바꿔 빙하기와 간빙기를 주기적으로 오가게 만든다는 이론을 제시했다.",
  "기후변화 과학적 합의": "전 세계 수천 명의 과학자들이 참여해 그동안 쌓인 기후 관련 연구들을 종합적으로 검토한 보고서들을 통해, 산업화 이후 인간이 배출한 온실가스가 최근의 지구 온난화를 주도하고 있다는 점에 과학계의 폭넓은 합의가 형성되어 있음을 정리해 보여준다.",
  "핵심종 개념": "페인은 바닷가 바위 지대에서 불가사리를 인위적으로 제거하는 실험을 했는데, 불가사리가 없어지자 그것이 잡아먹던 홍합이 폭발적으로 늘어나며 다른 생물들이 밀려나 생태계 전체의 다양성이 크게 줄어드는 것을 관찰했다. 이를 통해 개체 수는 적어도 생태계 구조 전체를 지탱하는 '핵심종'이라는 개념을 제시했다.",
  "섬 생물지리학 이론": "매카서와 윌슨은 여러 섬에 서식하는 생물 종의 수가 섬의 면적이 클수록, 그리고 본토에 가까울수록 많아지는 경향이 있다는 것을 이론화했다. 이 이론은 이후 자연보호구역의 크기와 배치를 설계하는 보전생물학 실무에도 널리 활용되었다.",

  "옴의 법칙": "옴은 여러 도선을 이용한 실험을 통해, 도선에 흐르는 전류가 걸어준 전압에 비례하고 저항에 반비례한다는 관계를 정량적으로 밝혔다. 이 단순한 법칙은 오늘날까지도 전기회로를 설계하고 분석하는 가장 기본적인 도구로 쓰인다.",
  "마이컬슨-몰리 실험": "당시 과학자들은 빛이 파동으로 전달되려면 그 매질인 '에테르'가 우주에 가득 차 있어야 한다고 믿었다. 마이컬슨과 몰리는 지구가 에테르 속을 움직이면 방향에 따라 빛의 속도가 달라질 것이라 예상하고 정밀하게 측정했지만, 어떤 차이도 발견하지 못했다. 이 뜻밖의 '실패한' 결과는 에테르라는 개념 자체를 흔들었고, 훗날 아인슈타인이 빛의 속도가 항상 일정하다고 가정하는 특수상대성이론을 만드는 데 중요한 실마리가 되었다.",
  "전자기파 실증 실험": "헤르츠는 전기 스파크를 이용해 전자기파를 직접 만들어내고, 떨어진 곳에서 그 신호를 수신하는 장치로 검출하는 데 성공했다. 이는 맥스웰이 순전히 이론적으로 예측했던 전자기파가 실제로 존재한다는 것을 실험으로 확인한 사건이었으며, 이후 라디오와 무선통신 기술의 토대가 되었다.",
  "경로적분 정식화": "파인만은 입자가 한 지점에서 다른 지점으로 이동할 때, 하나의 정해진 경로가 아니라 가능한 모든 경로를 동시에 지나가며 그 경로들이 서로 간섭한다는 방식으로 양자역학을 재구성했다. 이 '경로적분' 방법은 기존 방정식들과 수학적으로 동등하면서도 직관적인 그림을 제공해, 이후 입자물리학 계산의 표준 도구가 되었다.",
  "베타붕괴 이론": "일부 원자핵은 중성자가 양성자로 바뀌며 전자를 방출하는 베타붕괴를 겪는데, 당시에는 이 과정에서 에너지가 사라지는 것처럼 보이는 문제가 있었다. 페르미는 눈에 보이지 않는 입자(중성미자)가 함께 방출된다고 가정하고, 이 현상을 새로운 힘(약한 상호작용)으로 설명하는 이론을 수학적으로 완성했다.",

  "시데레우스 눈치우스": "갈릴레이는 스스로 개량한 망원경으로 밤하늘을 관측해, 목성 주위를 도는 네 개의 위성을 발견했다. 지구가 아닌 다른 천체를 중심으로 도는 천체가 있다는 사실은, 모든 것이 지구를 돈다는 천동설의 핵심 전제를 무너뜨리는 강력한 증거였다.",
  "우주 팽창 모델": "프리드만은 아인슈타인의 일반상대성이론 방정식을 우주 전체에 적용해 풀어보았는데, 그 해는 우주가 정지해 있지 않고 시간에 따라 팽창하거나 수축할 수 있다는 것을 보여주었다. 아인슈타인 본인은 처음에 이 결과를 믿지 않았지만, 훗날 허블의 관측으로 실제 우주가 팽창하고 있다는 것이 확인되며 이 모델이 옳았음이 밝혀졌다.",
  "일식 관측을 통한 일반상대성이론 검증": "아인슈타인의 이론에 따르면 무거운 천체 근처를 지나는 빛은 그 중력에 의해 살짝 휘어져야 한다. 에딩턴은 개기일식 때 태양 뒤에 가려질 별의 위치가 실제로 미세하게 어긋나 보이는지를 측정했고, 그 결과는 아인슈타인의 예측과 정확히 일치했다. 이 관측은 일반상대성이론을 대중적으로도 유명하게 만든 결정적 증거였다.",
  "우주 전파원 발견": "얀스키는 통신 잡음의 원인을 찾던 중, 하늘의 특정 방향(은하수 중심)에서 규칙적으로 강해지는 전파 신호를 발견했다. 이는 우주의 천체가 가시광선뿐 아니라 전파도 방출한다는 것을 처음 보여준 관측이었고, 이후 전파망원경을 이용한 전파천문학이라는 새로운 분야를 여는 계기가 되었다.",
  "명왕성 발견": "톰보는 서로 다른 시기에 찍은 밤하늘 사진을 정밀하게 비교하며 별들 사이에서 위치가 미세하게 움직인 천체를 찾는 고된 작업 끝에, 해왕성 궤도 바깥의 새로운 천체를 발견했다. 이 천체는 명왕성이라 불리며 태양계의 아홉 번째 행성으로 여겨지다가, 2006년 왜소행성으로 재분류되었다.",

  "보일의 법칙": "보일은 J자 모양의 유리관에 기체를 가두고 압력을 다르게 걸어주며 부피 변화를 측정했다. 그 결과 온도가 일정할 때 기체의 압력과 부피를 곱한 값이 항상 일정하다는, 즉 압력과 부피가 반비례한다는 규칙을 발견했다. 이는 기체의 행동을 수학적으로 다룬 최초의 정량적 법칙 중 하나다.",
  "일정성분비의 법칙": "프루스트는 여러 화합물을 정밀하게 분석해, 예를 들어 물은 항상 정확히 같은 질량비의 수소와 산소로 이루어져 있다는 것을 확인했다. 화합물마다 그 성분비가 항상 일정하다는 이 발견은, 물질이 더 이상 쪼갤 수 없는 원자들의 고정된 조합으로 이루어져 있다는 돌턴의 원자설을 뒷받침하는 중요한 증거가 되었다.",
  "기체반응의 법칙": "게이뤼삭은 기체들이 반응해 다른 기체를 만들 때, 반응에 참여하는 기체들의 부피 비율이 항상 간단한 정수비(1:1, 2:1 등)로 나타난다는 것을 발견했다. 이 규칙성은 훗날 아보가드로가 분자 개념을 제안하는 데 중요한 단서가 되었다.",
  "아보가드로 법칙": "아보가드로는 게이뤼삭의 기체반응 법칙을 설명하기 위해, 같은 온도와 압력에서는 기체의 종류와 상관없이 같은 부피 안에 같은 수의 입자(분자)가 들어있다는 가설을 제안했다. 당시에는 널리 받아들여지지 않았지만, 이후 분자량을 결정하는 기본 원리로 화학의 핵심 개념이 되었다.",
  "X선 결정학(브래그의 법칙)": "브래그 부자는 X선이 결정 속 원자들이 규칙적으로 배열된 층에 부딪혀 특정 각도에서만 강하게 반사(회절)된다는 규칙을 수학적으로 정리했다. 이 브래그의 법칙 덕분에 X선 회절 무늬를 분석해 물질 내부의 원자 배열을 알아낼 수 있게 되었으며, 이는 이후 DNA 구조 규명을 포함한 수많은 구조생물학·재료과학 연구의 핵심 도구가 되었다.",

  "마이크로그라피아": "후크는 자신이 개량한 현미경으로 코르크 조각의 얇은 단면을 들여다보다가, 작은 방들이 벌집처럼 촘촘히 늘어선 구조를 발견했다. 그는 이 구조가 수도원의 작은 방(cell)과 닮았다고 생각해 '세포'라는 이름을 붙였는데, 이는 생명체가 세포로 이루어져 있다는 개념이 등장하기 훨씬 전 최초로 세포를 관찰하고 기록한 사례다.",
  "미생물 최초 관찰": "레벤후크는 직접 유리를 갈아 아주 강력한 배율의 렌즈를 만들고, 빗물이나 치아 사이의 물질 같은 것들을 관찰하다가 그 안에서 꿈틀거리며 움직이는 아주 작은 생명체들을 발견했다. 눈에 보이지 않는 미생물의 세계를 인류 역사상 처음으로 목격하고 기록한 순간이었다.",
  "자연선택 공동 제안": "월리스는 동남아시아에서 현지 생물을 조사하던 중, 다윈과 마찬가지로 환경에 더 잘 적응한 개체가 살아남아 자손을 남기는 과정을 통해 생물이 진화한다는 생각에 독자적으로 도달했다. 그가 이 생각을 편지로 다윈에게 보내면서, 두 사람의 이론이 함께 학회에 발표되었고 이는 다윈이 '종의 기원'을 서둘러 출간하는 계기가 되었다.",
  "생식질 연속설": "바이스만은 몸을 이루는 일반 세포(체세포)와 자손에게 전달되는 생식세포가 처음부터 분리되어 있다고 보고, 부모가 살아가며 몸에 생긴 변화(예: 근육 단련)는 생식세포에 영향을 주지 않으므로 자손에게 유전되지 않는다고 주장했다. 이는 획득형질이 유전된다는 당시의 통념(용불용설)을 반박하며 현대 유전학의 기초 개념 중 하나가 되었다.",
  "초파리 유전 연구": "모건은 흰눈 돌연변이가 나타난 초파리를 발견하고 여러 세대에 걸쳐 교배 실험을 반복한 끝에, 이 형질이 암컷과 수컷에서 다른 비율로 나타난다는 것을 확인했다. 이를 통해 특정 유전자가 성을 결정하는 염색체 위에 물리적으로 위치한다는 것을 실험으로 증명해, 유전자가 염색체 위에 실제로 존재한다는 것을 보여주었다.",
  "1유전자-1효소설": "비들과 테이텀은 붉은빵곰팡이에 방사선을 쬐어 돌연변이를 일으킨 뒤, 특정 영양분을 스스로 만들지 못하게 된 균주들을 분석했다. 그 결과 하나의 유전자가 고장 나면 하나의 특정 효소만 만들어지지 않는다는 것을 발견해, 유전자가 특정 단백질(효소)을 만드는 정보 단위라는 원리를 처음 명확히 보여주었다.",
  "전령RNA 발견": "연구팀은 세포가 단백질을 만들 때 DNA의 정보가 곧바로 쓰이는 것이 아니라, 먼저 짧은 수명의 RNA 분자로 옮겨 적힌 뒤 이것이 단백질 공장(리보솜)으로 운반된다는 것을 실험으로 확인했다. 이 '전령RNA(mRNA)'의 발견으로 유전정보가 DNA에서 단백질로 전달되는 전체 경로의 중요한 고리가 밝혀졌다.",
  "유리-밀러 실험": "밀러와 유리는 초기 지구의 대기와 비슷하다고 여겨지던 기체(메탄, 암모니아, 수소, 수증기)를 유리 장치에 채우고 번개를 흉내 낸 전기 스파크를 계속 흘려보냈다. 몇 주 뒤 분석해보니 생명체를 이루는 기본 재료인 아미노산이 저절로 만들어져 있었고, 이는 단순한 화학물질에서 생명의 구성요소가 자연적으로 생겨날 수 있다는 가능성을 실험으로 보여준 연구였다.",
  "담배모자이크바이러스 결정화": "스탠리는 담배에 병을 일으키는 바이러스를 정제해 순수한 결정 형태로 만드는 데 성공했다. 결정을 이룰 수 있다는 것은 일반적으로 무생물 화학물질의 특징이었기에, 이 연구는 바이러스가 살아있는 생물과 단순한 화학물질의 경계에 있는 독특한 존재라는 것을 실험으로 보여주었다.",
  "오카자키 절편 발견": "오카자키는 DNA가 복제될 때 두 가닥의 방향이 서로 반대라는 점에 착안해, 한쪽 가닥은 길게 이어서 합성되지만 다른 쪽 가닥은 짧은 조각들로 나뉘어 불연속적으로 합성된 뒤 나중에 이어붙여진다는 것을 실험으로 밝혔다. 이 짧은 조각들은 그의 이름을 따 '오카자키 절편'이라 불린다.",
  "네안데르탈인 게놈 서열 해독": "페보와 연구팀은 수만 년 전 멸종한 네안데르탈인의 뼈 화석에서 극미량 남아있는 DNA를 정교한 기술로 추출하고 해독하는 데 성공했다. 이를 현생인류의 유전체와 비교한 결과, 오늘날 많은 인류 집단이 네안데르탈인의 유전자를 일부 물려받았다는 놀라운 사실이 밝혀졌다.",
  "인슐린 아미노산 서열 분석": "생어는 여러 해에 걸쳐 인슐린이라는 단백질을 이루는 아미노산들이 정확히 어떤 순서로 배열되어 있는지를 하나하나 밝혀냈다. 이는 단백질이 무작위가 아니라 유전자에 의해 정해진 고유한 화학구조를 가진다는 것을 처음 증명한 연구로, 이후 단백질 연구 전체의 초석이 되었다.",

  "콜레라 역학지도": "스노우는 런던에서 콜레라가 크게 유행하던 시기에 환자들의 집 위치를 지도 위에 하나하나 표시했고, 환자들이 특정 공동 우물 주변에 몰려 있다는 패턴을 발견했다. 그는 그 우물의 손잡이를 제거해 사용을 막았고 이후 환자 발생이 줄어들었는데, 이는 세균이라는 개념이 확립되기도 전에 통계와 지도만으로 감염원을 추적해낸 역학 조사의 시초로 꼽힌다.",
  "무균 수술법 도입": "리스터는 파스퇴르의 미생물 연구에서 영감을 받아, 수술 부위와 의료 기구, 심지어 수술실 공기에까지 석탄산(페놀)을 뿌려 소독하는 방법을 도입했다. 그 결과 수술 후 상처 감염으로 인한 사망률이 극적으로 줄어들었고, 이는 오늘날 무균 수술의 기본 원칙을 세운 연구였다.",
  "X선 발견": "뢴트겐은 진공관을 이용한 실험을 하던 중, 두꺼운 종이를 투과해 멀리 있는 형광판을 빛나게 하는 정체불명의 광선을 우연히 발견했다. 그는 이 광선으로 자기 아내의 손을 찍어 뼈가 그대로 드러난 사진을 얻었고, 이는 몸속을 들여다보지 않고도 진단할 수 있는 의료 영상 기술의 시작이었다.",
  "ABO 혈액형 발견": "란트슈타이너는 여러 사람의 혈액을 서로 섞는 실험을 하다가, 어떤 조합에서는 피가 뭉치고 어떤 조합에서는 그렇지 않다는 것을 발견해 사람의 혈액에 몇 가지 서로 다른 유형(A, B, O 등)이 있다는 것을 밝혔다. 이 발견 덕분에 맞는 혈액형끼리만 수혈하면 안전하다는 것이 알려지며 수많은 생명을 구할 수 있게 되었다.",
  "시트르산 회로 발견": "크레브스는 여러 해에 걸친 생화학 실험으로, 세포 안에서 포도당 등 영양분이 분해되며 에너지를 만들어내는 일련의 화학 반응들이 원형 고리 형태로 순환한다는 것을 밝혀냈다. 이 회로(시트르산 회로, 크렙스 회로)는 거의 모든 생물의 세포호흡에서 핵심적인 에너지 생산 경로로 밝혀졌다.",
  "방사면역측정법 개발": "야로와 벌슨은 방사성 동위원소로 표지한 물질을 이용해, 혈액 속에 아주 미량(수십억분의 1 수준)으로 존재하는 호르몬이나 약물의 농도를 정확히 측정하는 방법을 개발했다. 이 기술은 당뇨병 진단을 비롯한 수많은 의학 검사의 정밀도를 크게 끌어올렸다.",
  "T세포의 MHC 제한 발견": "도허티와 징커나겔은 바이러스에 감염된 세포를 면역세포(T세포)가 어떻게 알아보고 공격하는지를 연구해, 면역세포가 감염된 세포 표면의 특정 표지(MHC 분자)와 바이러스 조각을 함께 인식해야만 반응한다는 원리를 발견했다. 이는 면역계가 '자기'와 '비정상'을 구분하는 원리를 이해하는 데 핵심적인 연구였다.",
  "페니실린 정제 및 대량생산": "플레밍이 페니실린을 발견한 지 10여 년이 지난 뒤, 채인과 플로리가 이끄는 연구팀은 이 물질을 실제 약으로 쓸 수 있을 만큼 순수하게 정제하고 대량으로 생산하는 방법을 개발했다. 이들의 노력 덕분에 제2차 세계대전 중 수많은 부상병들의 생명을 구할 수 있었고, 항생제가 실제 의약품으로 실용화될 수 있었다.",
  "최초의 심장 이식 수술": "바너드는 뇌사한 기증자의 심장을 다른 환자에게 옮겨 붙이는, 당시로서는 극히 위험하고 파격적인 수술을 세계 최초로 성공시켰다. 수술받은 환자는 얼마 지나지 않아 사망했지만, 이 수술은 장기이식이 실제로 가능하다는 것을 보여주며 이후 이식 의학이 빠르게 발전하는 계기가 되었다.",
  "체외수정 기술": "에드워즈는 여러 해에 걸친 연구 끝에, 여성의 몸 밖에서 난자와 정자를 인공적으로 수정시킨 뒤 이를 다시 자궁에 착상시키는 체외수정(시험관아기) 기술을 완성했다. 이 기술로 1978년 세계 최초의 체외수정 아기가 태어났으며, 이후 전 세계 수백만 명의 불임 부부가 아이를 가질 수 있게 되었다.",
  "에테르 마취 시연": "모튼은 수술받는 환자에게 에테르라는 화학물질을 흡입시켜 의식과 통증을 느끼지 못하게 만든 뒤 종양 제거 수술을 진행하는 장면을 여러 의사들 앞에서 공개적으로 시연했다. 그전까지 극심한 고통을 참으며 받아야 했던 수술이 이 시연을 계기로 통증 없이 이루어질 수 있음이 알려지며 마취학이라는 분야가 시작되었다.",
  "말라리아 매개체 규명": "로스는 조류와 모기를 이용한 오랜 실험 끝에, 말라리아를 일으키는 기생충이 모기의 몸속에서 자라며 모기가 사람을 물 때 옮겨진다는 것을 실험으로 증명했다. 이 발견으로 모기를 통제하는 것이 말라리아를 예방하는 핵심 전략이 되었다.",

  "골지 염색법 개발": "골지는 은 화합물을 이용해 신경세포 중 일부만 무작위로, 그러나 아주 진하고 선명하게 염색되는 특수한 방법을 개발했다. 이 염색법 덕분에 복잡하게 얽힌 신경조직 속에서도 개별 신경세포의 전체 모양을 뚜렷하게 관찰할 수 있게 되어, 카할을 비롯한 이후 신경과학 연구의 필수 도구가 되었다.",
  "조건반사 연구": "파블로프는 개에게 먹이를 줄 때마다 종을 울리는 것을 반복했는데, 나중에는 먹이 없이 종소리만 들려줘도 개가 침을 흘리는 것을 관찰했다. 원래는 아무 의미 없던 자극(종소리)이 반복된 연합을 통해 특정 반응을 이끌어낼 수 있다는 이 '조건반사' 개념은 학습을 과학적으로 연구하는 심리학·신경과학의 초석이 되었다.",
  "장소세포 발견": "오키프는 쥐의 뇌 속 해마 부위에 미세 전극을 꽂아 신경활동을 기록하다가, 쥐가 특정 위치에 있을 때만 강하게 반응하는 신경세포들을 발견했다. 이 '장소세포'들은 마치 뇌 속에 내장된 지도처럼 작동하며, 동물이 어떻게 공간을 인식하고 기억하는지를 이해하는 중요한 단서가 되었다.",
  "반사궁과 시냅스 개념 확립": "셰링턴은 척수를 이용한 정교한 실험으로, 신경 신호가 감각기관에서 척수를 거쳐 근육으로 이어지는 경로(반사궁)를 연구했다. 그는 신경세포들이 물리적으로 완전히 이어져 있지 않고 특정 접합부를 통해 신호를 전달한다는 것을 추론해, 이 접합부를 '시냅스'라 이름 붙였다.",
  "격자세포 발견": "모세르 부부는 쥐가 자유롭게 돌아다닐 때 뇌의 특정 부위(내후각피질) 신경세포들이 마치 바둑판 같은 규칙적인 격자 패턴으로 활성화된다는 것을 발견했다. 이 '격자세포'는 장소세포와 함께 작동하며 동물이 자신의 위치와 이동 거리를 계산하는 내장 GPS 같은 역할을 한다는 것을 보여주었다.",
  "준비전위 실험": "리벳은 실험 참가자에게 원하는 순간에 자유롭게 손가락을 움직이게 하면서 동시에 뇌파를 측정했는데, 참가자가 '움직이기로 결심했다'고 스스로 느낀 시점보다 뇌에서 관련된 전기 신호(준비전위)가 먼저 시작된다는 것을 발견했다. 이 결과는 의식적인 선택이 정말로 행동의 '원인'인지에 대한 철학적·과학적 논쟁을 오늘날까지 이어지게 만들었다.",

  "지층누중의 법칙과 최초 지질도": "스미스는 운하 건설 현장에서 일하며 여러 지역의 지층을 관찰하다가, 지층에 포함된 화석의 종류를 보면 그 지층이 쌓인 순서를 알 수 있다는 규칙을 발견했다. 이를 바탕으로 그는 영국 전역의 지층 분포를 표시한 최초의 근대적 지질도를 혼자 힘으로 제작했다.",
  "동일과정설": "라이엘은 오늘날 우리가 관찰할 수 있는 침식, 퇴적, 화산활동 같은 느리고 평범한 지질 과정들이 아주 오랜 시간 쌓이면 산맥이나 협곡 같은 거대한 지형을 만들어낼 수 있다고 주장했다. 이 '동일과정설'은 지구의 나이가 훨씬 오래되었다는 인식을 확산시켰고, 훗날 다윈이 진화에 필요한 긴 시간의 개념을 받아들이는 데도 영향을 주었다.",
  "모호면 발견": "모호로비치치는 지진이 발생했을 때 지진파가 전달되는 속도와 경로를 분석하다가, 특정 깊이에서 지진파의 속도가 갑자기 달라지는 경계면을 발견했다. 이 경계면은 지각과 그 아래 맨틀을 구분하는 층으로 밝혀졌으며, 그의 이름을 따 '모호면'이라 불린다.",
  "변환단층 개념": "윌슨은 해저 지형을 연구하다가, 판구조론만으로는 설명하기 어려웠던 특이한 단층들이 사실은 판들이 서로 반대 방향으로 미끄러지며 어긋나는 새로운 유형의 경계라는 것을 알아챘다. 이 '변환단층' 개념이 더해지면서 판구조론은 지구 표면의 거의 모든 지질 현상을 설명할 수 있는 완성된 이론으로 자리잡았다.",
  "지구온난화 용어 사용": "브로커는 대기 중 이산화탄소 농도가 계속 증가하면 앞으로 지구의 기온이 뚜렷하게 상승할 것이라 예측하는 논문을 발표하며, 그 제목에 '지구온난화'라는 표현을 사용했다. 이 표현은 이후 기후변화 문제를 대중에게 알리는 대표적인 용어로 널리 자리잡았다.",

  "보스-아인슈타인 통계": "보스는 빛 입자(광자)처럼 서로 구별할 수 없는 동일한 입자들이 여러 에너지 상태에 어떻게 분포하는지를 설명하는 새로운 통계적 방법을 고안했다. 아인슈타인은 이 방법을 일반적인 입자에도 확장했고, 이 통계를 따르는 입자들은 훗날 '보손'이라 불리며 자연을 이루는 입자를 두 큰 부류로 나누는 기준이 되었다.",
  "알파-베타-감마 논문": "가모프와 동료들은 빅뱅 직후 극도로 뜨거웠던 초기 우주에서 양성자와 중성자가 핵반응을 거듭하며 수소, 헬륨 같은 가벼운 원소들이 만들어졌을 것이라는 계산을 제시했다. 이 연구는 빅뱅 이론이 우주 속 원소의 비율을 실제로 설명할 수 있는지를 검증한 초기의 중요한 시도였다.",
  "원자설": "돌턴은 여러 화합물의 질량 관계를 분석한 끝에, 모든 물질이 더 이상 쪼갤 수 없는 아주 작은 입자인 원자로 이루어져 있고, 같은 원소의 원자는 모두 같은 질량을 가지며, 화합물은 서로 다른 원소의 원자가 일정한 비율로 결합해 만들어진다는 이론을 제시했다. 이는 고대 그리스의 막연한 원자 개념을 실험적 증거에 기반한 근대 과학 이론으로 바꿔놓은 연구였다.",
  "LDL 수용체 발견": "골드스타인과 브라운은 콜레스테롤을 지나치게 많이 축적해 어린 나이에 심장병을 앓는 환자들을 연구하다가, 세포 표면에서 혈액 속 콜레스테롤(LDL)을 붙잡아 세포 안으로 들여보내는 수용체 단백질을 발견했다. 이 수용체에 이상이 생기면 콜레스테롤이 혈액에 쌓여 심혈관질환으로 이어진다는 것이 밝혀지며, 이후 콜레스테롤을 낮추는 치료제 개발의 중요한 토대가 되었다.",
  "코리 회로": "칼 코리와 거티 코리 부부는 몸을 움직일 때 근육에서 에너지를 얻는 과정에서 생기는 젖산이 혈액을 타고 간으로 이동해 다시 포도당으로 바뀐 뒤, 이 포도당이 다시 근육으로 보내져 에너지원으로 쓰이는 순환 경로를 규명했다. 이 '코리 회로'는 우리 몸이 운동 중 에너지를 어떻게 재활용하는지를 보여주는 핵심적인 대사 경로다.",
  "살바르산 개발": "에얼리히는 수백 가지 화합물을 하나하나 시험한 끝에, 매독을 일으키는 병원체만을 선택적으로 공격하면서 사람 몸에는 비교적 안전한 화합물(살바르산)을 찾아냈다. 특정 질병을 표적으로 하는 화학물질을 인위적으로 만들어 치료에 쓴다는 이 접근은 '화학요법'이라는 새로운 치료 분야를 열었다.",
  "설파제(프론토질) 개발": "도마크는 염료로 쓰이던 화합물 중 일부가 몸속에서 세균의 성장을 억제하는 효과를 낸다는 것을 발견해, 프론토질이라는 설파제 약물을 개발했다. 페니실린이 널리 쓰이기 전, 이 약은 폐렴이나 산욕열 같은 세균 감염으로 목숨을 잃던 수많은 환자들을 구해내며 항생제 시대의 서막을 열었다.",
  "브로카 영역 발견": "브로카는 말을 거의 하지 못하지만 다른 사람의 말은 이해할 수 있었던 환자를 부검한 끝에, 그 환자의 뇌 좌측 전두엽 특정 부위가 손상되어 있다는 것을 발견했다. 이는 뇌의 특정 기능(이 경우 말하기)이 뇌 전체에 고르게 퍼져 있는 것이 아니라 특정 부위에 국한되어 있다는 것을 보여준 최초의 결정적 증거였다.",
  "해저확장설": "헤스는 대양 한가운데를 가로지르는 해저산맥(해령)에서 뜨거운 맨틀 물질이 계속 솟아올라 새로운 해양지각을 만들고, 이 지각이 양옆으로 서서히 밀려나며 넓어진다는 이론을 제시했다. 이 '해저확장설'은 베게너의 대륙이동설이 왜, 어떻게 일어나는지에 대한 구체적인 메커니즘을 제공하며 판구조론이 완성되는 데 결정적인 역할을 했다.",
  "대서양 해저지형도 제작": "타프와 히젠은 배에서 음파를 쏘아 해저까지의 깊이를 측정한 방대한 자료를 하나하나 손으로 분석하고 그려, 대서양 한가운데에 길게 뻗은 거대한 해저산맥과 그 중심의 갈라진 틈(열곡)을 세밀한 지도로 완성했다. 이 지도는 당시로서는 파격적이었던 대륙이동설과 해저확장설을 뒷받침하는 시각적이고 설득력 있는 증거가 되었다.",

  "트랜지스터 발명": "바딘, 브래튼, 쇼클리는 반도체 물질을 이용해 아주 작은 크기로도 전류를 증폭하거나 스위치처럼 켜고 끌 수 있는 소자를 개발했다. 부피가 크고 잘 고장 나던 진공관을 대체한 이 트랜지스터는 이후 컴퓨터, 통신기기 등 현대 전자산업 전체의 토대가 되었다.",
  "레이저 발명": "메이먼은 특정 물질에 강한 빛을 쏘아 원자들을 들뜨게 한 뒤, 그 에너지를 한 방향으로 정렬된 단일 파장의 강력한 빛으로 방출시키는 장치를 최초로 구현했다. 레이저는 이후 통신, 의료, 정밀 가공 등 셀 수 없이 많은 분야에서 핵심 도구로 쓰이게 되었다.",
  "고온초전도체 발견": "베드노르츠와 뮐러는 특정 세라믹 화합물이 기존에 알려진 초전도체보다 훨씬 높은 온도에서도 전기저항이 완전히 사라진다는 것을 발견했다. 이는 초전도 현상을 훨씬 저렴한 냉각 방식으로도 활용할 수 있는 길을 열며 초전도체 연구에 큰 활력을 불어넣었다.",
  "양전자 발견": "앤더슨은 우주에서 쏟아지는 고에너지 입자(우주선)가 구름 상자를 지나가는 궤적을 사진으로 분석하다가, 전자와 질량은 같지만 반대 전하를 띠는 입자의 흔적을 발견했다. 이는 디랙이 이론으로 예측했던 반입자(양전자)가 실제로 존재한다는 것을 확인한 최초의 실험적 증거였다.",
  "중성미자 최초 검출": "카원과 라인스는 원자로에서 대량으로 방출되지만 물질과 거의 반응하지 않아 검출이 극도로 어려운 입자인 중성미자를 찾기 위해 원자로 근처에 특수한 검출 장치를 설치했다. 수개월의 실험 끝에 이들은 중성미자가 실제로 존재한다는 것을 최초로 실험적으로 확인했다.",
  "콤프턴 효과": "콤프턴은 X선을 물질에 쏘았을 때 튕겨 나오는 X선의 파장이 원래보다 길어진다는 것을 관측했다. 이는 빛이 마치 당구공처럼 전자와 충돌해 에너지를 주고받는다고 봐야만 설명되는 현상으로, 빛이 입자(광자)로도 행동한다는 것을 다시 한번 확인해준 결정적 증거였다.",
  "물질파 이론": "드브로이는 빛이 파동이면서 동시에 입자(광자)로도 행동한다면, 반대로 전자 같은 입자도 파동의 성질을 가질 수 있지 않을까 하는 대담한 가설을 제안했다. 이 물질파 개념은 이후 전자현미경 개발과 슈뢰딩거의 파동방정식으로 이어지며 양자역학의 핵심 토대가 되었다.",
  "벨 부등식 위반 실험": "아스페는 서로 멀리 떨어뜨려 놓은, 양자역학적으로 '얽힌' 두 입자를 측정하는 정교한 실험을 통해, 두 입자의 행동이 미리 정해진 '숨은 변수'로는 설명될 수 없다는 것을 보였다. 이는 양자역학이 예측하는 기이한 비국소적 상관관계가 실제로 자연의 성질이라는 것을 실험으로 확인한 중요한 연구였다.",
  "W·Z 보손 발견": "루비아와 판데르메이르가 이끄는 연구팀은 거대 입자가속기에서 양성자와 반양성자를 충돌시켜, 약한 상호작용을 매개한다고 이론적으로 예측되었던 무거운 입자인 W와 Z 보손을 실험적으로 발견했다. 이 발견은 전자기력과 약한 핵력을 하나로 통합한 이론이 옳다는 것을 뒷받침하는 결정적 증거였다.",
  "전기약 통합이론": "와인버그, 살람, 글래쇼는 각자의 연구를 통해, 겉보기에는 전혀 달라 보이는 전자기력과 약한 핵력이 사실 아주 높은 에너지에서는 하나의 동일한 힘에서 갈라져 나온 것임을 보이는 이론을 완성했다. 이 '전기약 이론'은 이후 자연의 근본적인 힘들을 하나로 통합하려는 연구의 중요한 성공 사례가 되었다.",
  "컴퓨터 구조(폰노이만 구조)": "폰 노이만은 컴퓨터가 처리할 데이터뿐 아니라 그 처리 순서를 지시하는 프로그램 자체도 같은 메모리 공간에 함께 저장해두고 순차적으로 꺼내 쓰는 구조를 제안했다. 프로그램을 바꾸는 것만으로 하드웨어를 바꾸지 않고도 다른 작업을 할 수 있게 해준 이 구조는 오늘날 거의 모든 컴퓨터의 기본 설계 원리가 되었다.",
  "펄서 발견": "조슬린 벨 버넬은 전파망원경 데이터를 분석하다가, 아주 규칙적인 간격으로 깜빡이는 정체불명의 전파 신호를 포착했다. 처음에는 외계 신호가 아닐까 하는 농담 섞인 추측도 있었지만, 이 신호는 빠르게 회전하며 등대처럼 전파를 방출하는 초고밀도 천체인 중성자별(펄서)이라는 것이 곧 밝혀졌다.",
  "X선 천문학 개척": "자코니는 로켓에 X선 검출기를 실어 대기권 위로 쏘아 올리는 실험을 통해, 태양이 아닌 우리은하 바깥의 천체에서도 강한 X선이 온다는 것을 처음으로 검출했다. 이 발견은 눈에 보이는 빛 너머의 우주를 관측하는 X선 천문학이라는 새로운 분야를 여는 출발점이 되었다.",
  "우주 중성미자 관측": "IceCube 연구팀은 남극 얼음 속 깊숙이 대규모 검출기를 매설해, 거의 모든 물질을 그대로 통과해버리는 입자인 중성미자가 아주 가끔 얼음 분자와 충돌할 때 생기는 미세한 빛을 포착하는 방식으로 우주 저 먼 곳에서 날아온 고에너지 중성미자를 관측하는 데 성공했다.",
  "적외선 발견": "허셜은 프리즘으로 햇빛을 무지개색으로 분산시킨 뒤, 눈에 보이는 붉은빛의 바깥쪽 끝에 온도계를 놓아보았다. 그 부분에서도 온도가 올라가는 것을 발견해, 사람 눈에는 보이지 않지만 실제로 존재하는 빛(적외선)이 있다는 것을 처음으로 실험으로 확인했다.",
  "오르트 구름 이론": "오르트는 태양계를 스쳐 지나가는 혜성들의 궤도를 분석해, 이 혜성들이 태양계 가장 바깥쪽에 넓게 퍼져 있는 거대한 얼음 천체 무리에서 비롯되었을 것이라는 가설을 제안했다. 아직 직접 관측되지는 않았지만, 오늘날까지도 장주기 혜성의 기원을 설명하는 표준 이론으로 받아들여지고 있다.",
  "하버-보슈법": "하버와 보슈는 공기 중에 풍부하지만 그대로는 식물이 이용할 수 없는 질소 기체를, 높은 온도와 압력 및 촉매를 이용해 암모니아로 바꾸는 공업적 방법을 개발했다. 이 암모니아는 화학비료의 원료가 되어 전 세계 농업 생산량을 크게 늘렸으며, 오늘날 지구상 인류를 먹여 살리는 식량의 상당 부분이 이 기술 덕분이라는 평가를 받는다.",
  "지글러-나타 촉매": "지글러와 나타는 특정 금속 화합물을 촉매로 사용하면, 작은 분자(단량체)들이 훨씬 더 정교하고 규칙적인 구조로 길게 연결되어 고분자(플라스틱)를 이룬다는 것을 발견했다. 이 촉매 기술로 더 튼튼하고 균일한 성질의 플라스틱을 대량생산할 수 있게 되었다.",
  "풀러렌 발견": "커얼, 크로토, 스몰리는 탄소를 레이저로 증발시키는 실험을 하다가, 탄소 원자 60개가 마치 축구공처럼 둥글게 연결된 완전히 새로운 형태의 탄소 분자를 발견했다. '풀러렌'이라 불리는 이 분자의 발견은 탄소에게 다이아몬드, 흑연 외에 또 다른 형태(동소체)가 있다는 것을 보여주며 나노과학 발전의 중요한 계기가 되었다.",
  "그래핀 분리": "가임과 노보셀로프는 흑연 덩어리에 평범한 접착테이프를 붙였다 떼어내는 것을 반복하는 간단한 방법으로, 탄소 원자 한 층 두께밖에 안 되는 얇디얇은 막(그래핀)을 분리해내는 데 성공했다. 그래핀은 매우 얇으면서도 강철보다 강하고 전기가 잘 통해, 이후 차세대 소재 연구의 핵심 재료로 주목받고 있다.",
  "분자궤도 대칭 보존 원리": "우드워드와 호프만은 유기분자가 화학반응을 통해 구조를 바꿀 때, 분자 속 전자가 채워진 궤도의 대칭성이 반응의 진행 방향과 속도를 결정한다는 규칙을 제시했다. 이 원리 덕분에 화학자들은 복잡한 유기반응이 실제로 일어날지 여부를 실험 전에 미리 예측할 수 있게 되었다.",

function getBest(cat) {
  try { return parseInt(localStorage.getItem('science_best_' + cat) || '0', 10); }
  catch (e) { return 0; }
}
function setBest(cat, score) {
  try {
    const cur = getBest(cat);
    if (score > cur) localStorage.setItem('science_best_' + cat, String(score));
  } catch (e) {}
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ========================= 퀴즈 탭 ========================= */
const quizArea = document.getElementById('quiz-area');
const catChips = document.getElementById('cat-chips');
let currentCat = null;

function renderCatChips() {
  catChips.innerHTML = FIELD_ORDER.map(cat => `
    <button class="chip" data-cat="${cat}">
      ${FIELD_EMOJI[cat] || ''} ${cat} <span class="best">최고 ${getBest(cat)}</span>
    </button>
  `).join('') + `<button class="chip" data-cat="전체">🎲 전체 랜덤</button>`;

  catChips.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      currentCat = chip.dataset.cat;
      catChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      renderQuizIntro();
    });
  });
}
renderCatChips();

function getQuestionSet(cat) {
  if (cat === '전체') {
    let all = [];
    Object.values(QUESTIONS).forEach(qs => all = all.concat(qs));
    return shuffle(all).slice(0, 5);
  }
  return shuffle(QUESTIONS[cat] || []).slice(0, 5);
}

function renderQuizIntro() {
  if (!currentCat) {
    quizArea.innerHTML = `<div class="quiz-intro"><p>위에서 분야를 선택해서 퀴즈를 시작해보세요.</p></div>`;
    return;
  }
  const qCount = currentCat === '전체' ? Math.min(5, Object.values(QUESTIONS).flat().length) : Math.min(5, (QUESTIONS[currentCat] || []).length);
  quizArea.innerHTML = `
    <div class="quiz-intro">
      <h2>${FIELD_EMOJI[currentCat] || '🎲'} ${currentCat} 퀴즈</h2>
      <p>총 ${qCount}문제 · 현재 최고 기록: ${getBest(currentCat)}문제</p>
      <button class="start-btn" id="start-quiz-btn">시작하기</button>
    </div>`;
  document.getElementById('start-quiz-btn').addEventListener('click', () => startQuiz(currentCat));
}
renderQuizIntro();

let quizState = null;

function startQuiz(cat) {
  const questions = getQuestionSet(cat);
  quizState = { cat, questions, index: 0, score: 0 };
  renderQuestion();
}

function renderQuestion() {
  const { questions, index, score } = quizState;
  const total = questions.length;
  const q = questions[index];

  quizArea.innerHTML = `
    <div id="quiz-progress"><span>문제 ${index + 1} / ${total}</span><span>점수 ${score}</span></div>
    <div id="progress-bar-track"><div id="progress-bar-fill" style="width:${(index / total) * 100}%"></div></div>
    <div class="q-card">
      <div class="q-text">${escapeHtml(q.q)}</div>
      <div id="choices"></div>
      <div id="explain-slot"></div>
    </div>`;

  const choicesEl = document.getElementById('choices');
  q.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.addEventListener('click', () => selectAnswer(i));
    choicesEl.appendChild(btn);
  });
}

function selectAnswer(i) {
  const { questions, index } = quizState;
  const q = questions[index];
  const buttons = document.querySelectorAll('.choice-btn');
  buttons.forEach(b => b.disabled = true);
  buttons[q.a].classList.add('correct');
  if (i !== q.a) buttons[i].classList.add('wrong');
  else quizState.score++;

  document.getElementById('explain-slot').innerHTML = `
    <div class="explain-box">💡 ${escapeHtml(q.e)}</div>
    <button class="next-btn" id="next-btn">${index + 1 < questions.length ? '다음 문제' : '결과 보기'}</button>`;

  document.getElementById('next-btn').addEventListener('click', () => {
    quizState.index++;
    if (quizState.index < questions.length) renderQuestion();
    else renderResult();
  });
}

function renderResult() {
  const { cat, score, questions } = quizState;
  setBest(cat, score);
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  let msg = '조금 더 도전해봐요!';
  if (pct === 100) msg = '완벽해요! 진짜 과학 박사네요 🏆';
  else if (pct >= 70) msg = '훌륭해요! 꽤 많이 알고 있네요 👏';
  else if (pct >= 40) msg = '나쁘지 않아요, 계속 배워봐요 📖';

  quizArea.innerHTML = `
    <div class="result-card">
      <div class="result-msg">${cat} 퀴즈 결과</div>
      <div class="result-score">${score} / ${total}</div>
      <div class="result-msg">${msg}</div>
      <div class="result-best">이 분야 최고 기록: ${getBest(cat)}문제</div>
      <div class="result-actions">
        <button class="ghost-btn" id="retry-btn">다시 풀기</button>
        <button class="start-btn" id="other-btn">다른 분야 선택</button>
      </div>
    </div>`;
  document.getElementById('retry-btn').addEventListener('click', () => startQuiz(cat));
  document.getElementById('other-btn').addEventListener('click', () => { currentCat = null; catChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); renderQuizIntro(); });
}

  { keys: ["파장", "주파수"], a: "파장은 파동이 한 번 반복되는 데 걸리는 거리, 주파수(진동수)는 1초 동안 반복되는 횟수예요. 둘은 반비례 관계라 파장이 짧을수록 주파수는 높아져요." },
  { keys: ["질량"], a: "질량은 물체가 가진 물질의 양을 나타내는 값이에요. 무게(중력에 따라 달라짐)와 달리, 질량은 어디에 있든 변하지 않아요." },
  { keys: ["밀도"], a: "밀도는 어떤 물질이 단위 부피당 얼마나 무거운지를 나타내는 값이에요(질량 ÷ 부피). 밀도가 낮은 물질은 밀도가 높은 물질 위에 뜨는 경향이 있어요." },
  { keys: ["운동량"], a: "운동량은 물체의 질량과 속도를 곱한 값으로, 물체가 얼마나 '세게 움직이고 있는지'를 나타내요. 외부 힘이 없으면 전체 운동량은 보존돼요." },
  { keys: ["광합성"], a: "광합성은 식물이 빛 에너지를 이용해 이산화탄소와 물로 포도당(양분)과 산소를 만드는 과정이에요. 지구 대기의 산소 대부분이 이 과정을 통해 만들어졌어요." },
  { keys: ["세포호흡"], a: "세포호흡은 세포가 포도당과 산소를 이용해 에너지(ATP)를 만들어내는 과정이에요. 광합성과 정반대 방향의 화학반응이라 할 수 있어요." },
  { keys: ["생태계"], a: "생태계는 어떤 지역에 사는 생물들과, 그들을 둘러싼 물·온도·토양 같은 환경 요소가 서로 영향을 주고받는 하나의 체계예요." },
  { keys: ["면역", "항체"], a: "면역은 몸이 병원체 같은 이물질을 알아보고 방어하는 시스템이에요. 항체는 면역세포가 만드는 단백질로, 특정 병원체에 달라붙어 무력화시켜요." },
  { keys: ["바이러스"], a: "바이러스는 스스로 물질대사를 하지 못하고, 다른 생물의 세포 안에 들어가야만 증식할 수 있는 아주 작은 감염성 입자예요. 세포로 이루어져 있지 않아 생물과 무생물의 경계로 여겨지기도 해요." },
  { keys: ["세균", "박테리아"], a: "세균(박테리아)은 핵막이 없는 단순한 구조의 단세포 생물이에요. 대부분 무해하거나 오히려 이롭지만, 일부는 질병을 일으키기도 해요." },
  { keys: ["항상성"], a: "항상성은 몸이 체온, 혈당, 수분량 같은 내부 환경을 일정하게 유지하려는 성질이에요. 외부 환경이 변해도 몸 안의 조건을 안정적으로 지키려는 작동 원리예요." },

  { keys: ["힘"], a: "힘은 물체의 운동 상태(속도나 방향)를 바꾸는 원인이 되는 작용이에요. 힘을 받으면 물체는 가속하거나, 방향이 바뀌거나, 모양이 변할 수 있어요." },
  { keys: ["가속도"], a: "가속도는 속도가 시간에 따라 얼마나 빠르게 변하는지를 나타내요. 속도가 빨라지든 느려지든, 방향이 바뀌든 모두 가속도가 있는 상태예요." },
  { keys: ["속도"], a: "속도는 단위 시간당 위치가 얼마나 변하는지를 나타내는 값이에요. 빠르기(속력)와 방향을 함께 담고 있어요." },
  { keys: ["에너지"], a: "에너지는 어떤 일을 할 수 있는 능력이에요. 운동에너지, 위치에너지, 열에너지, 화학에너지 등 여러 형태로 존재하며 서로 바뀔 수 있지만 총량은 보존돼요." },
  { keys: ["전력"], a: "전력은 전기가 단위 시간당 하는 일의 양, 즉 전기 에너지가 소비되거나 생산되는 속도예요. 단위는 와트(W)를 써요." },
  { keys: ["전압"], a: "전압은 전기가 흐르게 만드는 '압력' 같은 개념이에요. 두 지점 사이의 전기적 위치에너지 차이를 나타내며, 단위는 볼트(V)예요." },
  { keys: ["전류"], a: "전류는 전하(전기를 띤 입자)가 단위 시간당 얼마나 많이 흐르는지를 나타내요. 단위는 암페어(A)예요." },
  { keys: ["저항"], a: "저항은 전류가 흐르는 것을 방해하는 정도예요. 저항이 클수록 같은 전압에서 전류가 적게 흘러요." },
  { keys: ["자기장"], a: "자기장은 자석이나 전류 주변에 생기는, 자성을 가진 물체에 힘을 미치는 공간이에요. 나침반 바늘이 항상 일정한 방향을 가리키는 것도 지구 자기장 때문이에요." },
  { keys: ["전기장"], a: "전기장은 전하 주변에 생기는, 다른 전하에 힘을 미치는 공간이에요. 전하를 놓으면 그 전하가 받는 힘의 방향과 크기를 결정해요." },
  { keys: ["전자기파"], a: "전자기파는 전기장과 자기장이 서로를 만들어내며 공간을 퍼져나가는 파동이에요. 가시광선, 전파, X선, 자외선 등이 모두 전자기파의 한 종류예요." },
  { keys: ["굴절"], a: "굴절은 빛이나 파동이 서로 다른 물질의 경계를 지날 때 속도가 변하면서 진행 방향이 꺾이는 현상이에요. 물속에 있는 빨대가 꺾여 보이는 이유예요." },
  { keys: ["반사"], a: "반사는 빛이나 파동이 물체 표면에 부딪혀 다시 튕겨 나오는 현상이에요. 거울에 모습이 비치는 것이 대표적인 예예요." },
  { keys: ["회절"], a: "회절은 파동이 장애물이나 좁은 틈을 만났을 때 그 뒤쪽으로 휘어져 퍼지는 현상이에요." },
  { keys: ["간섭"], a: "간섭은 두 개 이상의 파동이 만났을 때 서로 세기를 더하거나 상쇄시키는 현상이에요." },
  { keys: ["진폭"], a: "진폭은 파동이 진동하는 폭, 즉 가장 높은 지점과 중심 사이의 거리예요. 소리라면 진폭이 클수록 더 크게 들려요." },
  { keys: ["공명"], a: "공명은 어떤 물체가 가진 고유한 진동수와 같은 주기로 힘이 가해질 때 진폭이 크게 증가하는 현상이에요. 그네를 타이밍에 맞춰 밀면 더 높이 올라가는 것도 공명의 예예요." },
  { keys: ["마찰력"], a: "마찰력은 서로 맞닿은 두 면이 상대적으로 미끄러지는 것을 방해하는 힘이에요." },
  { keys: ["관성"], a: "관성은 물체가 원래의 운동 상태(정지 또는 등속운동)를 계속 유지하려는 성질이에요. 버스가 갑자기 멈출 때 몸이 앞으로 쏠리는 것도 관성 때문이에요." },
  { keys: ["중력"], a: "중력은 질량을 가진 물체들이 서로 끌어당기는 힘이에요. 뉴턴은 이를 힘으로, 아인슈타인은 시공간이 휘어진 결과로 설명했어요." },
  { keys: ["부력"], a: "부력은 액체나 기체 속의 물체를 위로 밀어 올리는 힘이에요. 물체가 밀어낸 유체의 무게만큼 부력을 받아요(아르키메데스의 원리)." },
  { keys: ["압력"], a: "압력은 단위 면적에 가해지는 힘의 크기예요. 같은 힘이라도 좁은 면적에 가해지면 압력이 더 커져요." },
  { keys: ["온도"], a: "온도는 물질을 이루는 입자들이 얼마나 활발하게 움직이는지를 나타내는 척도예요. 입자의 운동이 활발할수록 온도가 높아요." },
  { keys: ["열량"], a: "열량은 물체가 주고받는 열에너지의 양이에요. 단위로는 칼로리(cal)나 줄(J)을 써요." },
  { keys: ["비열"], a: "비열은 어떤 물질 1g의 온도를 1도 올리는 데 필요한 열량이에요. 물은 비열이 커서 잘 데워지지도, 잘 식지도 않아요." },
  { keys: ["융해"], a: "융해는 고체가 열을 받아 액체로 변하는 현상이에요(예: 얼음이 물로 녹는 것)." },
  { keys: ["기화"], a: "기화는 액체가 열을 받아 기체로 변하는 현상이에요(예: 물이 끓어 수증기가 되는 것)." },
  { keys: ["승화"], a: "승화는 고체가 액체를 거치지 않고 바로 기체로 변하는 현상이에요(예: 드라이아이스가 사라지는 것)." },
  { keys: ["전도"], a: "전도는 물질을 이루는 입자들의 충돌을 통해 열이 직접 접촉면을 따라 전달되는 방식이에요(예: 뜨거운 냄비 손잡이가 뜨거워지는 것)." },
  { keys: ["대류"], a: "대류는 액체나 기체가 직접 이동하면서 열을 옮기는 방식이에요(예: 난방기 근처 뜨거운 공기가 위로 올라가는 것)." },
  { keys: ["복사(열)", "열복사"], a: "복사는 매개물 없이 전자기파 형태로 열이 전달되는 방식이에요. 태양열이 진공인 우주를 건너 지구까지 전달되는 방식이 바로 이거예요." },
  { keys: ["초전도체"], a: "초전도체는 아주 낮은 온도에서 전기 저항이 완전히 사라지는 물질이에요. 저항이 없으니 에너지 손실 없이 전류가 흐를 수 있어요." },
  { keys: ["반도체"], a: "반도체는 도체(전기가 잘 통하는 물질)와 절연체(전기가 안 통하는 물질)의 중간 성질을 가진 물질이에요. 조건에 따라 전기가 통하기도, 안 통하기도 해서 컴퓨터 칩의 핵심 재료로 쓰여요." },
  { keys: ["절연체"], a: "절연체는 전기가 거의 통하지 않는 물질이에요(예: 고무, 유리). 전선의 겉을 감싸 감전을 막는 데 쓰여요." },
  { keys: ["플라즈마"], a: "플라즈마는 기체가 매우 높은 에너지를 받아 원자에서 전자가 떨어져 나간, 이온과 전자가 뒤섞인 상태예요. 물질의 네 번째 상태로 불리며, 번개나 태양이 플라즈마 상태예요." },
  { keys: ["스펙트럼"], a: "스펙트럼은 빛을 파장(색)별로 분해해서 늘어놓은 것이에요. 과학자들은 별빛의 스펙트럼을 분석해 별의 성분이나 온도를 알아내요." },
  { keys: ["파동"], a: "파동은 에너지가 매질(또는 전자기장)을 통해 진동하며 퍼져나가는 현상이에요. 소리, 빛, 물결이 모두 파동의 예예요." },
  { keys: ["진동수"], a: "진동수는 파동이 1초 동안 몇 번 진동하는지를 나타내는 값이에요. 단위는 헤르츠(Hz)를 쓰고, 소리의 경우 진동수가 높을수록 음이 높게 들려요." },
  { keys: ["각운동량"], a: "각운동량은 회전하는 물체가 얼마나 세게 돌고 있는지를 나타내는 양이에요. 외부에서 힘(토크)이 가해지지 않으면 보존돼요(예: 피겨스케이팅 선수가 팔을 모으면 더 빨리 도는 것)." },

  { keys: ["산"], a: "산은 물에 녹으면 수소이온(H+)을 내놓는 물질이에요. 신맛이 나고 pH가 7보다 낮아요(예: 식초, 레몬즙)." },
  { keys: ["염기"], a: "염기는 물에 녹으면 수산화이온(OH-)을 내놓거나 수소이온을 받아들이는 물질이에요. pH가 7보다 높고 미끈거리는 느낌이 나요(예: 비누)." },
  { keys: ["ph", "수소이온농도"], a: "pH는 어떤 용액이 산성인지 염기성인지를 나타내는 숫자예요. 7이면 중성, 숫자가 낮을수록 산성, 높을수록 염기성이에요." },
  { keys: ["산화"], a: "산화는 어떤 물질이 전자를 잃는 화학반응이에요. 쇠가 녹스는 것, 사과가 갈변하는 것이 대표적인 산화 반응이에요." },
  { keys: ["환원"], a: "환원은 어떤 물질이 전자를 얻는 화학반응이에요. 산화와 환원은 항상 짝을 이루어 함께 일어나요." },
  { keys: ["촉매"], a: "촉매는 화학반응이 일어나는 속도를 빠르게 해주면서도 자신은 반응 전후로 변하지 않는 물질이에요. 우리 몸속 효소도 생체 촉매예요." },
  { keys: ["용액"], a: "용액은 한 물질(용질)이 다른 물질(용매) 속에 고르게 녹아 섞인 혼합물이에요(예: 소금물)." },
  { keys: ["용매"], a: "용매는 다른 물질을 녹이는 역할을 하는, 용액에서 더 많은 양을 차지하는 물질이에요(예: 소금물에서 물)." },
  { keys: ["용질"], a: "용질은 용매에 녹아 들어가는 물질이에요(예: 소금물에서 소금)." },
  { keys: ["농도"], a: "농도는 용액 안에 용질이 얼마나 많이 녹아 있는지를 나타내는 정도예요." },
  { keys: ["몰"], a: "몰(mol)은 화학에서 입자의 개수를 세는 단위예요. 1몰은 약 6.02×10²³개의 입자를 의미해요." },
  { keys: ["결정"], a: "결정은 원자나 분자가 규칙적이고 반복적인 배열로 단단하게 뭉친 고체예요(예: 소금 결정, 눈 결정)." },
  { keys: ["동소체"], a: "동소체는 같은 원소로 이루어져 있지만 원자 배열이 달라 성질이 다른 물질이에요(예: 탄소로 이루어진 다이아몬드와 흑연)." },
  { keys: ["고분자"], a: "고분자는 작은 단위 분자(단량체)가 아주 길게 반복적으로 연결되어 만들어진 큰 분자예요(예: 플라스틱, DNA, 단백질)." },
  { keys: ["유기화합물"], a: "유기화합물은 탄소를 기본 골격으로 하는 화합물이에요. 생명체를 이루는 대부분의 물질(단백질, 탄수화물, 지방 등)이 유기화합물이에요." },
  { keys: ["무기화합물"], a: "무기화합물은 탄소를 중심 골격으로 하지 않는 화합물이에요(예: 물, 소금, 이산화탄소)." },
  { keys: ["이성질체"], a: "이성질체는 화학식(구성 원자의 종류와 개수)은 같지만 원자의 배열이 달라 서로 다른 성질을 가진 화합물이에요." },

function findElement(rawQuery) {
  const mentionsContext = /원소|기호|주기율표/.test(rawQuery);
  let q = rawQuery.trim();
  q = q.replace(/(원소\s*기호|원소|기호|주기율표)/g, ' ');
  q = q.replace(/(가|이|은|는|의)?\s*(무엇인가요|무엇이야|뭐예요|뭔가요|뭐야|뭐지|알려줘|궁금해|인가요|인지)\s*[?!.]*$/g, '');
  q = q.replace(/[?!.]+$/g, '').trim();
  const compact = q.replace(/\s+/g, '');
  if (!compact) return null;

  // 원자번호로 질문한 경우 (예: "원자번호 26")
  const numMatch = rawQuery.match(/원자\s*번호\s*(\d{1,3})/);
  if (numMatch) {
    const z = parseInt(numMatch[1], 10);
    const el = ELEMENTS.find(e => e.z === z);
    if (el) return el;
  }

  // 원소기호(알파벳 1~2자) 정확히 일치
  const bySymbol = ELEMENTS.find(e => e.symbol.toLowerCase() === compact.toLowerCase());
  if (bySymbol) return bySymbol;

  // 원소 이름과 정확히 일치
  const byName = ELEMENTS.find(e => e.name === compact);
  if (byName) return byName;

  // 문맥상 원소/기호 언급이 있을 때만 이름 포함 여부로 매칭 (오탐 방지)
  if (mentionsContext) {
    const byNameIncludes = ELEMENTS.find(e => rawQuery.includes(e.name));
    if (byNameIncludes) return byNameIncludes;
  }
  return null;
}

/* ========================= 오타 보정(유사 단어 매칭) ========================= */
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,      // 삭제
        dp[i][j - 1] + 1,      // 삽입
        dp[i - 1][j - 1] + cost // 치환
      );
    }
  }
  return dp[m][n];
}

const FUZZY_CANDIDATES = [];

  const answer = `${e.name}의 원소기호는 ${e.symbol}이고, 원자번호는 ${e.z}번이에요.`;
  FUZZY_CANDIDATES.push({ key: e.name, answer, src: null });
  if (e.symbol.length >= 2) FUZZY_CANDIDATES.push({ key: e.symbol.toLowerCase(), answer, src: null });
});

function fuzzyFind(query) {
  const tokens = query.toLowerCase().replace(/[?!.,]/g, ' ').split(/\s+/)
    .filter(t => t.length >= 2)
    .map(t => t.replace(/(가|이|은|는|을|를|과|와|도|의)$/, '')) // 흔한 조사 제거
    .filter(t => t.length >= 2);

  let best = null, bestDist = Infinity, bestToken = null;
  tokens.forEach(t => {
    FUZZY_CANDIDATES.forEach(c => {
      if (Math.abs(c.key.length - t.length) > 2) return; // 길이 차이가 크면 후보에서 제외
      const dist = levenshtein(t, c.key);
      const threshold = c.key.length <= 3 ? 1 : 2; // 짧은 단어는 1글자, 긴 단어는 2글자까지 오타 허용
      if (dist <= threshold && dist < bestDist) {
        bestDist = dist; best = c; bestToken = t;
      }
    });
  });
  if (!best) return null;
  return { ...best, correctedFrom: bestToken };
}

/* 논문 기반 답변에 매번 다른 표현을 섞어주는 함수 */
function formatPaperAnswer(p) {
  const detail = getDetail(p);
  const intros = [
    () => p.summary,
    () => `한마디로, ${p.summary}`,
    () => `${p.author}(${p.year})의 연구에 따르면, ${p.summary}`,
    () => detail ? detail : p.summary,
    () => detail ? `조금 더 자세히 보면: ${detail}` : `${p.title} 연구를 보면, ${p.summary}`,
    () => `${p.title}(${p.author}, ${p.year})의 핵심은 이거예요. ${p.summary}`
  ];
  const pick = intros[Math.floor(Math.random() * intros.length)];
  return pick();
}

function findAnswer(query) {
  const q = query.toLowerCase();
  // 0) 원소기호 매칭 (가장 정확한 매칭이라 우선)
  const el = findElement(query);
  if (el) return { text: `${el.name}의 원소기호는 ${el.symbol}이고, 원자번호는 ${el.z}번이에요.`, src: null };
  // 1) 논문 목록에서 키워드 점수 매칭 (가장 우선 — 보유한 논문 내용 기반으로 답변)
  const tokens = q.split(/[\s?!.,는은이가을를에서과와도의]+/).filter(t => t.length >= 2);
  let best = null, bestScore = 0;
  PAPERS.forEach(p => {
    const hay = (p.title + ' ' + p.summary + ' ' + p.author).toLowerCase();
    let score = 0;
    tokens.forEach(t => { if (hay.includes(t)) score++; });
    if (score > bestScore) { bestScore = score; best = p; }
  });
  if (best && bestScore > 0) {
    return { text: formatPaperAnswer(best), src: `${best.author} (${best.year}) · ${best.title}` };
  }
  // 2) FAQ 매칭 (논문 목록에 없는 기본 개념 질문 보완)
  for (const item of FAQ_DB) {
    if (item.keys.some(k => q.includes(k))) return { text: item.a, src: null };
  }
  // 3) 용어 사전 매칭
  for (const item of GLOSSARY_DB) {
    if (item.keys.some(k => q.includes(k))) return { text: item.a, src: null };
  }
  // 4) 오타가 있어도 비슷한 단어를 찾아 보정
  const fuzzy = fuzzyFind(query);
  if (fuzzy) {
    return { text: fuzzy.answer, src: fuzzy.correctedFrom !== fuzzy.key ? `오타 보정: "${fuzzy.correctedFrom}" → "${fuzzy.key}"` : null };
  }
  return {
    text: "아직 이 질문에는 답할 준비가 안 됐어요. 저는 미리 준비된 과학 지식(보유한 논문 + 기본 FAQ)에서만 답할 수 있어요. 다른 단어로 다시 질문하거나, '논문 둘러보기' 탭에서 직접 찾아볼래요?",
    src: null
  };
}

(async () => {
