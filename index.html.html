const AI_INSTRUCTIONS = `당신은 "사이언스"라는 이름의 과학 전문 도우미입니다. 사용자의 어떤 과학 질문에도 자유롭고 친절하게, 한국어로 답변하세요. 정확한 과학적 사실에 기반해 답하고, 확실하지 않은 내용은 모른다고 솔직히 말하세요. 답변은 너무 길지 않게, 이해하기 쉽게 써주세요.

참고로 이 앱은 아래와 같은 과학사의 주요 논문·연구 목록을 자료로 갖고 있습니다. 질문이 이 중 하나와 관련 있다면 자연스럽게 언급해도 좋습니다.
${PAPERS.map(p => `- ${p.author} (${p.year}) ${p.title}`).join('\n')}`;

function appendThinkingBubble() {
  if (askChat.querySelector('.ask-empty')) askChat.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'ask-row bot';
  const bubble = document.createElement('div');
  bubble.className = 'ask-bubble';
  bubble.textContent = '생각하는 중...';
  row.appendChild(bubble);
  askChat.appendChild(row);
  askChat.scrollTop = askChat.scrollHeight;
  return { row, bubble };
}

const HIDE_FEATURE_CODES = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];

async function sendAsk() {
  const text = askInput.value.trim();
  if (!text) return;
  appendAskBubble('user', text);
  askInput.value = '';

  if (claudeSample) {
    const { row, bubble } = appendThinkingBubble();
    try {
      const turns = askHistoryData.map(m => ({ role: m.role === 'bot' ? 'assistant' : 'user', content: m.text }));
      const input = [{ role: 'user', content: AI_INSTRUCTIONS }, ...turns];
      const result = await claudeSample(input, {
        cache: false,
        onText: ({ text: partial }) => {
          bubble.textContent = partial || '생각하는 중...';
          askChat.scrollTop = askChat.scrollHeight;
        }
      });
      bubble.textContent = result.text;
      askHistoryData.push({ role: 'bot', text: result.text, src: null });
      if (currentUser) saveChatHistory(currentUser, askHistoryData);
    } catch (err) {
      row.remove();
      if (HIDE_FEATURE_CODES.includes(err.code)) claudeSample = null; // 이후로는 오프라인 방식으로만 답변
      const { text: answer, src } = findAnswer(text);
      appendAskBubble('bot', answer, src);
    }
  } else {
    setTimeout(() => {
      const { text: answer, src } = findAnswer(text);
      appendAskBubble('bot', answer, src);
    }, 200);
  }
}
askSendBtn.addEventListener('click', sendAsk);
askInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendAsk(); });

/* ========================= 배경음악 (K-POP + R&B + Y2K 느낌의 그루브) ========================= */
const NOTE_SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteFreq(name, octave) {
  const semitone = NOTE_SEMITONES[name] + (octave - 4) * 12;
  return 440 * Math.pow(2, (semitone - 9) / 12); // A4 = 440Hz 기준
}

const BG_TEMPO_BPM = 96; // R&B 느낌의 살짝 여유있는 템포
const STEPS_PER_LOOP = 32; // 4마디, 한 마디 = 8스텝(8분음표)

// 코드 진행: Am7 - Fmaj7 - Cmaj7 - G (K-POP/R&B에서 자주 쓰이는 vi-IV-I-V 진행), 마디당 8스텝
const BG_BASS = [
  { n: "A2", bar: 0 }, { n: "F2", bar: 1 }, { n: "C2", bar: 2 }, { n: "G2", bar: 3 }
];

// 멜로디 훅: { n: 음이름+옥타브 (null=쉼표), d: 길이(8분음표 단위) } — 4마디(32스텝) 반복
const BG_MELODY = [
  { n: null, d: 1 }, { n: "E5", d: 1 }, { n: "G5", d: 1 }, { n: "A5", d: 2 },
  { n: null, d: 1 }, { n: "G5", d: 1 }, { n: "E5", d: 1 },
  { n: null, d: 1 }, { n: "F5", d: 1 }, { n: "A5", d: 1 }, { n: "C6", d: 2 },
  { n: null, d: 1 }, { n: "A5", d: 1 }, { n: "F5", d: 1 },
  { n: null, d: 1 }, { n: "E5", d: 1 }, { n: "G5", d: 1 }, { n: "C6", d: 2 },
  { n: null, d: 1 }, { n: "G5", d: 1 }, { n: "E5", d: 1 },
  { n: null, d: 1 }, { n: "D5", d: 1 }, { n: "G5", d: 1 }, { n: "B5", d: 2 },
  { n: null, d: 1 }, { n: "G5", d: 1 }, { n: "D5", d: 1 }
];

// 드럼 패턴 (마디 내 8스텝 기준): 킥·스네어 자리, 하이햇은 매 스텝
const KICK_STEPS = [0, 4];
const SNARE_STEPS = [2, 6];

let audioCtx = null;
let noiseBuffer = null;
let musicPlaying = false;
let musicTimer = null;
let musicStep = 0;
let melodyIdx = 0;
let melodyRemaining = 0;
let delayBus = null; // 자연스러운 공간감을 위한 약한 딜레이(잔향) 버스

function setupAudioGraph(ctx) {
  const delay = ctx.createDelay(1.0);
  delay.delayTime.value = 0.24;
  const feedback = ctx.createGain();
  feedback.gain.value = 0.22;
  const wet = ctx.createGain();
  wet.gain.value = 0.5;
  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(wet);
  wet.connect(ctx.destination);
  delayBus = delay;
}

function getNoiseBuffer(ctx) {
  if (noiseBuffer) return noiseBuffer;
  const len = ctx.sampleRate * 0.3;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  noiseBuffer = buf;
  return buf;
}

function humanTime(t) { return t + (Math.random() - 0.5) * 0.014; } // 사람이 연주하듯 살짝 어긋나는 타이밍
function humanVel(base) { return base * (0.82 + Math.random() * 0.34); } // 매번 살짝 다른 세기

// 멜로디: 살짝 따뜻한 R&B 톤 + 미세한 비브라토와 자연스러운 볼륨 곡선으로 기계적인 느낌을 줄임
function playMelodyNote(freq, durSeconds, startTime) {
  const ctx = audioCtx;
  const t = humanTime(startTime);
  const vel = humanVel(0.13);

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 3000 + Math.random() * 600;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vel, t + 0.035); // 살짝 부드러운 어택
  gain.gain.setTargetAtTime(0, t + durSeconds * 0.55, durSeconds * 0.4); // 자연스러운 감쇠 곡선
  filter.connect(gain);
  gain.connect(ctx.destination);
  const send = ctx.createGain();
  send.gain.value = 0.22;
  gain.connect(send);
  send.connect(delayBus);

  // 미세한 비브라토(사람이 흥얼거리듯 음정이 아주 살짝 흔들림)
  const vibrato = ctx.createOscillator();
  vibrato.frequency.value = 4.5 + Math.random();
  const vibratoDepth = ctx.createGain();
  vibratoDepth.gain.value = freq * 0.006;
  vibrato.connect(vibratoDepth);

  const osc1 = ctx.createOscillator();
  osc1.type = 'triangle';
  osc1.frequency.value = freq;
  vibratoDepth.connect(osc1.detune);
  osc1.connect(filter);
  osc1.start(t);
  osc1.stop(t + durSeconds + 0.08);

  const osc2 = ctx.createOscillator(); // 살짝 디튠한 두 번째 레이어 (Y2K 신스 코러스 느낌)
  osc2.type = 'sine';
  osc2.frequency.value = freq * (1.004 + Math.random() * 0.004);
  osc2.connect(filter);
  osc2.start(t);
  osc2.stop(t + durSeconds + 0.08);

  vibrato.start(t);
  vibrato.stop(t + durSeconds + 0.08);
}

// 베이스: 부드러운 사인 + 로우패스로 R&B 특유의 둥근 저음
function playBassNote(freq, durSeconds, startTime) {
  const ctx = audioCtx;
  const t = humanTime(startTime);
  const vel = humanVel(0.16);
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 450 + Math.random() * 100;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vel, t + 0.04);
  gain.gain.setTargetAtTime(0, t + durSeconds * 0.6, durSeconds * 0.35);
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + durSeconds + 0.08);
}

function playKick(startTime) {
  const ctx = audioCtx;
  const t = humanTime(startTime);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(135 + Math.random() * 10, t);
  osc.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  gain.gain.setValueAtTime(humanVel(0.22), t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.16);
}

function playSnare(startTime) {
  const ctx = audioCtx;
  const t = humanTime(startTime);
  const noise = ctx.createBufferSource();
  noise.buffer = getNoiseBuffer(ctx);
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1700 + Math.random() * 300;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(humanVel(0.13), t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  const send = ctx.createGain();
  send.gain.value = 0.15;
  gain.connect(send);
  send.connect(delayBus);
  noise.start(t);
  noise.stop(t + 0.12);
}

function playHat(startTime, accent) {
  const ctx = audioCtx;
  const t = humanTime(startTime);
  const noise = ctx.createBufferSource();
  noise.buffer = getNoiseBuffer(ctx);
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 7000;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(humanVel(accent ? 0.055 : 0.026), t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  noise.start(t);
  noise.stop(t + 0.05);
}

function scheduleNextStep() {
  const ctx = audioCtx;
  const eighth = 60 / BG_TEMPO_BPM / 2;
  const stepInLoop = musicStep % STEPS_PER_LOOP;
  const stepInBar = stepInLoop % 8;
  const bar = Math.floor(stepInLoop / 8);
  // R&B 특유의 셔플(스윙) 그루브: 짝수 스텝은 살짝 당기고, 홀수 스텝은 살짝 밀어서 그루브감을 줌 (매번 미세하게 다르게)
  const swingAmount = 0.15 + Math.random() * 0.08;
  const swing = (stepInLoop % 2 === 1) ? eighth * swingAmount : 0;
  const startTime = ctx.currentTime + 0.02 + swing;

  // 베이스: 마디 시작 스텝에서만 새로 연주(한 마디 내내 울림)
  if (stepInBar === 0) {
    const bassNote = BG_BASS[bar].n;
    const [, bn, bo] = bassNote.match(/^([A-G])(\d)$/);
    playBassNote(noteFreq(bn, parseInt(bo, 10)), eighth * 7.5, startTime);
  }

  // 드럼
  if (KICK_STEPS.includes(stepInBar)) playKick(startTime);
  if (SNARE_STEPS.includes(stepInBar)) playSnare(startTime);
  playHat(startTime, stepInBar % 4 === 0);

  // 멜로디: 남은 길이가 0이 되면 다음 멜로디 음표로 진행
  if (melodyRemaining <= 0) {
    const note = BG_MELODY[melodyIdx % BG_MELODY.length];
    if (note.n) {
      const [, mn, mo] = note.n.match(/^([A-G])(\d)$/);
      playMelodyNote(noteFreq(mn, parseInt(mo, 10)), eighth * note.d * 0.92, startTime);
    }
    melodyRemaining = note.d;
    melodyIdx++;
  }
  melodyRemaining--;

  musicStep++;
  musicTimer = setTimeout(scheduleNextStep, eighth * 1000);
}

/* ========================= 베토벤 교향곡 5번 "운명" (곡 자체는 저작권이 만료된 곡 — 모티브를 직접 합성해서 편곡) ========================= */
let musicTrack = 'kpop'; // 'beethoven' | 'kpop'  (기본: 원래 K-POP 스타일)
const NOTE_ACC = { 'b': -1, '#': 1, '': 0 };
function noteFreq2(name) { // Eb4, Ab4 처럼 플랫(b)/샵(#)이 붙은 음 이름도 처리
  const m = name.match(/^([A-G])([b#]?)(\d)$/);
  const semitone = NOTE_SEMITONES[m[1]] + NOTE_ACC[m[2]] + (parseInt(m[3], 10) - 4) * 12;
  return 440 * Math.pow(2, (semitone - 9) / 12);
}

const BEETHOVEN_EIGHTH = 0.17;        // 8분음표 한 칸의 길이(초)
const BEETHOVEN_LOOP_EIGHTHS = 64;    // 한 바퀴 길이(8분음표 64칸 ≈ 11초)
const BEETHOVEN_EVENTS = (() => {
  const ev = [];
  // "따따따 딴" 운명 모티브: 쉼표 1칸 + 같은 음 3번 + 길게 끄는 음
  const motif = (t, p, q, hold, vol) => {
    for (let i = 1; i <= 3; i++) ev.push({ t: t + i, d: 0.85, n: p, v: vol, tim: i === 1 });
    ev.push({ t: t + 4, d: hold, n: q, v: vol * 1.1, tim: true, held: true });
  };
  motif(0, 'G4', 'Eb4', 6, 0.8);   // 따따따 딴~
  motif(10, 'F4', 'D4', 6, 0.8);   // 따따따 딴~
  motif(20, 'Ab4', 'F4', 3, 0.9);  // 모티브가 한 단계씩 올라가며 점점 커짐
  motif(27, 'Bb4', 'G4', 3, 1.0);
  motif(34, 'C5', 'Ab4', 3, 1.1);
  motif(41, 'Eb5', 'C5', 4, 1.2);
  motif(49, 'G4', 'Eb4', 6, 1.2);  // 처음 모티브로 돌아와 마무리
  return ev;
})();

let beethovenTimer = null;
let beethovenBus = null;

// 현악기 느낌: 톱니파 두 겹(살짝 디튠) + 한 옥타브 아래 삼각파(첼로·콘트라베이스 느낌)
function playStringNote(freq, startTime, durSec, vol, bus, held) {
  const ctx = audioCtx;
  const peak = 0.085 * vol;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1400 + vol * 700;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.linearRampToValueAtTime(peak, startTime + 0.035);
  gain.gain.setValueAtTime(peak, startTime + Math.max(0.04, durSec - 0.14));
  gain.gain.linearRampToValueAtTime(0.0001, startTime + durSec);
  filter.connect(gain);
  gain.connect(bus);
  [
    { type: 'sawtooth', f: freq, g: 0.5 },
    { type: 'sawtooth', f: freq * 1.005, g: 0.4 },
    { type: 'triangle', f: freq / 2, g: 0.6 }
  ].forEach(l => {
    const osc = ctx.createOscillator();
    osc.type = l.type;
    osc.frequency.value = l.f;
    const lg = ctx.createGain();
    lg.gain.value = l.g;
    osc.connect(lg);
    lg.connect(filter);
    if (held) { // 길게 끄는 음에는 현악기처럼 살짝 떨림(비브라토)
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 5.2;
      const depth = ctx.createGain();
      depth.gain.value = 8; // 음정 흔들림 폭(cent)
      lfo.connect(depth);
      depth.connect(osc.detune);
      lfo.start(startTime);
      lfo.stop(startTime + durSec + 0.05);
    }
    osc.start(startTime);
    osc.stop(startTime + durSec + 0.05);
  });
}

// 팀파니: 낮은 사인파가 순간적으로 음이 내려가며 울림
function playTimpani(freq, startTime, vol, bus) {
  const ctx = audioCtx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq * 1.6, startTime);
  osc.frequency.exponentialRampToValueAtTime(freq, startTime + 0.09);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.linearRampToValueAtTime(0.28 * vol, startTime + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.7);
  osc.connect(gain);
  gain.connect(bus);
  osc.start(startTime);
  osc.stop(startTime + 0.75);
}

// 한 바퀴(약 11초)를 미리 예약해두고, 끝나기 직전에 다음 바퀴를 이어서 예약
function scheduleBeethovenLoop(startTime) {
  if (!beethovenBus) return;
  const ctx = audioCtx;
  const E = BEETHOVEN_EIGHTH;
  BEETHOVEN_EVENTS.forEach(ev => {
    const t0 = startTime + ev.t * E;
    const f = noteFreq2(ev.n);
    playStringNote(f, t0, ev.d * E, ev.v, beethovenBus, ev.held);
    if (ev.tim) {
      let tf = f;
      while (tf > 110) tf /= 2; // 팀파니는 낮은 음역으로
      playTimpani(tf, t0, ev.v, beethovenBus);
    }
  });
  const nextStart = startTime + BEETHOVEN_LOOP_EIGHTHS * E;
  const waitMs = Math.max(0, (nextStart - ctx.currentTime - 0.6) * 1000);
  beethovenTimer = setTimeout(() => scheduleBeethovenLoop(nextStart), waitMs);
}
function startBeethoven() {
  const ctx = audioCtx;
  beethovenBus = ctx.createGain();
  beethovenBus.gain.value = 1;
  beethovenBus.connect(ctx.destination);
  const send = ctx.createGain(); // 공연장 울림 같은 약한 잔향
  send.gain.value = 0.18;
  beethovenBus.connect(send);
  send.connect(delayBus);
  scheduleBeethovenLoop(ctx.currentTime + 0.15);
}
function stopBeethoven() {
  clearTimeout(beethovenTimer);
  if (beethovenBus) {
    const bus = beethovenBus;
    beethovenBus = null;
    bus.gain.setTargetAtTime(0, audioCtx.currentTime, 0.04); // 이미 예약된 소리는 서서히 줄여서 끔
    setTimeout(() => { try { bus.disconnect(); } catch (e) {} }, 600);
  }
}

/* ========================= 재생/정지, 음악 바꾸기 ========================= */
const musicToggleBtn = document.getElementById('music-toggle');
const musicTrackBtn = document.getElementById('music-track');
const TRACK_INFO = {
  beethoven: { icon: '🎻', title: '배경음악: 베토벤 5번 "운명" (눌러서 바꾸기)' },
  kpop: { icon: '🎤', title: '배경음악: K-POP 스타일 (눌러서 바꾸기)' }
};

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    setupAudioGraph(audioCtx);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function startMusic() {
  musicPlaying = true;
  musicToggleBtn.textContent = '🔊';
  musicToggleBtn.classList.add('playing');
  if (musicTrack === 'beethoven') {
    startBeethoven();
  } else {
    musicStep = 0;
    melodyIdx = 0;
    melodyRemaining = 0;
    scheduleNextStep();
  }
}
function stopMusic() {
  musicPlaying = false;
  musicToggleBtn.textContent = '🔇';
  musicToggleBtn.classList.remove('playing');
  clearTimeout(musicTimer);
  stopBeethoven();
}

musicToggleBtn.addEventListener('click', () => {
  ensureAudio();
  if (musicPlaying) stopMusic(); else startMusic();
});
musicTrackBtn.addEventListener('click', () => {
  musicTrack = musicTrack === 'beethoven' ? 'kpop' : 'beethoven';
  musicTrackBtn.textContent = TRACK_INFO[musicTrack].icon;
  musicTrackBtn.title = TRACK_INFO[musicTrack].title;
  if (musicPlaying) { ensureAudio(); stopMusic(); startMusic(); } // 재생 중이면 바로 새 음악으로 교체
});


/* ========================= 로그인 / 회원가입 (아이디 중복 체크, 비밀번호 없음) ========================= */
const USERS_KEY = 'science_users';
const SESSION_KEY = 'science_session';

// 간단한 문자열 해시 (완전한 보안용은 아니고, 평문 저장을 피하기 위한 용도)
function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (Math.imul(31, hash) + str.charCodeAt(i)) | 0;
  }
  return String(hash);
}

// users는 항상 { 아이디: 비밀번호해시 또는 null } 형태의 객체로 통일해서 다룸
function loadUsers() {
  try {
    const parsed = JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
    if (Array.isArray(parsed)) {
      // 예전 버전(비밀번호 없던 방식)에서 저장된 아이디 배열 → 비밀번호 미설정(null) 상태로 이어받기
      const obj = {};
      parsed.forEach(id => { obj[id] = null; });
      return obj;
    }
    if (parsed && typeof parsed === 'object') return parsed;
    return {};
  } catch (e) { return {}; }
}
function saveUsers(users) {
  try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); } catch (e) {}
}
function setSession(username) {
  try { localStorage.setItem(SESSION_KEY, username); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}
function getSession() {
  try { return localStorage.getItem(SESSION_KEY); } catch (e) { return null; }
}

const authScreen = document.getElementById('auth-screen');
const appRoot = document.getElementById('app');
const loginForm = document.getElementById('login-form');
const signupForm = document.getElementById('signup-form');
const loginError = document.getElementById('login-error');
const signupError = document.getElementById('signup-error');
const userBadgeName = document.getElementById('user-badge-name');
let currentUser = null;

function showAuthError(el, msg) {
  el.textContent = msg;
  el.classList.remove('hidden');
}
function hideAuthError(el) {
  el.classList.add('hidden');
}

function enterApp(username) {
  currentUser = username;
  userBadgeName.textContent = `👋 ${username}`;
  authScreen.classList.add('hidden');
  appRoot.classList.remove('hidden');
  restoreChatForUser(username);
}

document.getElementById('show-signup').addEventListener('click', () => {
  loginForm.classList.add('hidden');
  signupForm.classList.remove('hidden');
  hideAuthError(loginError);
});
document.getElementById('show-login').addEventListener('click', () => {
  signupForm.classList.add('hidden');
  loginForm.classList.remove('hidden');
  hideAuthError(signupError);
});

document.getElementById('signup-btn').addEventListener('click', () => {
  try {
    const id = document.getElementById('signup-id').value.trim();
    const pw = document.getElementById('signup-pw').value;
    const pw2 = document.getElementById('signup-pw2').value;
    hideAuthError(signupError);

    if (!id || !pw) return showAuthError(signupError, '아이디와 비밀번호를 모두 입력해주세요.');
    if (id.length > 12) return showAuthError(signupError, '아이디는 12자 이내로 입력해주세요.');
    if (pw.length < 4) return showAuthError(signupError, '비밀번호는 4자 이상으로 입력해주세요.');
    if (pw !== pw2) return showAuthError(signupError, '비밀번호가 서로 일치하지 않아요.');

    const users = loadUsers();
    if (Object.prototype.hasOwnProperty.call(users, id)) {
      return showAuthError(signupError, '이미 사용 중인 아이디예요.');
    }

    users[id] = simpleHash(pw);
    saveUsers(users);
    setSession(id);
    enterApp(id);
  } catch (err) {
    showAuthError(signupError, '가입 중 문제가 생겼어요: ' + (err && err.message ? err.message : err));
  }
});

document.getElementById('login-btn').addEventListener('click', () => {
  try {
    const id = document.getElementById('login-id').value.trim();
    const pw = document.getElementById('login-pw').value;
    hideAuthError(loginError);

    if (!id || !pw) return showAuthError(loginError, '아이디와 비밀번호를 입력해주세요.');

    const users = loadUsers();
    if (!Object.prototype.hasOwnProperty.call(users, id)) {
      return showAuthError(loginError, '등록되지 않은 아이디예요. 먼저 회원가입을 해주세요.');
    }

    if (users[id] === null || users[id] === undefined) {
      // 예전 버전(비밀번호 없이 만든 계정) → 지금 입력한 비밀번호로 새로 설정
      users[id] = simpleHash(pw);
      saveUsers(users);
    } else if (users[id] !== simpleHash(pw)) {
      return showAuthError(loginError, '비밀번호가 올바르지 않아요.');
    }

    setSession(id);
    enterApp(id);
  } catch (err) {
    showAuthError(loginError, '로그인 중 문제가 생겼어요: ' + (err && err.message ? err.message : err));
  }
});

document.getElementById('logout-btn').addEventListener('click', () => {
  clearSession();
  currentUser = null;
  askHistoryData = [];
  renderAskEmpty();
  appRoot.classList.add('hidden');
  authScreen.classList.remove('hidden');
  loginForm.classList.remove('hidden');
  signupForm.classList.add('hidden');
  document.getElementById('login-id').value = '';
  document.getElementById('login-pw').value = '';
  document.getElementById('signup-id').value = '';
  document.getElementById('signup-pw').value = '';
  document.getElementById('signup-pw2').value = '';
});

['login-id', 'login-pw'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });
});
['signup-id', 'signup-pw', 'signup-pw2'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('signup-btn').click();
  });
});

// 이미 로그인된 세션이 있으면 자동으로 앱 화면으로 (비밀번호 재확인 없이 유지)
(function autoLogin() {
  const session = getSession();
  const users = loadUsers();
  if (session && Object.prototype.hasOwnProperty.call(users, session)) enterApp(session);
})();

<script>
(function(){

function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;S=[];for(var i=0;i<160;i++)S.push([Math.random()*W,Math.random()*H,Math.random()*1.4+.3,Math.random()*6])}
rs();addEventListener('resize',rs);
(function loop(t){cx.fillStyle='#04070f';cx.fillRect(0,0,W,H);for(var i=0;i<S.length;i++){var s=S[i];cx.globalAlpha=.4+.6*Math.abs(Math.sin(t/1200+s[3]));cx.fillStyle='#fff';cx.fillRect(s[0],s[1],s[2],s[2])}cx.globalAlpha=1;requestAnimationFrame(loop)})(0);
/* 게임 열기/닫기 */

function fsOn(){try{var e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen){var p=e.requestFullscreen();if(p&&p.catch)p.catch(function(){})}}catch(x){}}

  if(id==='ai'&&SCIENCE_AI_URL){mount(function(f){f.src=SCIENCE_AI_URL},id);return}

}

}

addEventListener('keydown',function(e){if(!cur&&(e.key==='f'||e.key==='F')&&!e.ctrlKey&&!e.metaKey)fsToggle();if(e.key==='Escape'&&$('ai').classList.contains('on'))$('ai').classList.remove('on')});
addEventListener('message',function(e){var f=$('stage').querySelector('iframe');if(f&&e.source===f.contentWindow&&e.data&&e.data.quviaGalaxy==='exit')close()});
})();
